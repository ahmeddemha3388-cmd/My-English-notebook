<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التعبيرات الإنجليزية</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef4ff, #f8fbff);
    color: #172033;
}

header {
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: white;
    text-align: center;
    padding: 30px 18px;
    border-radius: 0 0 28px 28px;
}

header h1 {
    margin: 0;
    font-size: 29px;
}

header p {
    margin: 10px 0 0;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 22px 16px;
}

.back {
    display: inline-block;
    background: white;
    color: #2563eb;
    text-decoration: none;
    padding: 10px 17px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.intro {
    background: white;
    padding: 20px;
    border-radius: 20px;
    margin-bottom: 20px;
    line-height: 1.8;
    box-shadow: 0 8px 25px rgba(30,60,100,0.10);
}

.expression {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 6px 20px rgba(30,60,100,0.08);
}

.number {
    color: #667085;
    font-size: 14px;
    margin-bottom: 8px;
}

.english {
    direction: ltr;
    text-align: left;
    font-size: 21px;
    font-weight: bold;
    color: #2563eb;
    margin-bottom: 8px;
}

.arabic {
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 12px;
}

.listen {
    border: none;
    background: #2563eb;
    color: white;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

.listen:hover {
    background: #1d4ed8;
}

footer {
    text-align: center;
    padding: 30px;
    color: #667085;
}
</style>
</head>

<body>

<header>
    <h1>🗣️ التعبيرات الإنجليزية</h1>
    <p>English Expressions</p>
</header>

<div class="container">

<a class="back" href="index.html">← العودة إلى الرئيسية</a>

<div class="intro">
    <strong>🧠 50 تعبيرًا من المبتدئ إلى المتقدم</strong>
    <br>
    تعلّم التعبير، اقرأ معناه بالعربية، ثم استمع إلى النطق الإنجليزي.
</div>

<div id="expressions"></div>

</div>

<footer>
    My English Notebook © 2026
</footer>

<script>

const expressions = [

{en:"Hello!", ar:"مرحبًا!"},
{en:"How are you?", ar:"كيف حالك؟"},
{en:"I'm fine, thank you.", ar:"أنا بخير، شكرًا لك."},
{en:"Nice to meet you.", ar:"سعيد بلقائك."},
{en:"See you later.", ar:"أراك لاحقًا."},

{en:"Thank you very much.", ar:"شكرًا جزيلًا."},
{en:"You're welcome.", ar:"على الرحب والسعة."},
{en:"Excuse me.", ar:"عذرًا."},
{en:"I'm sorry.", ar:"أنا آسف."},
{en:"No problem.", ar:"لا مشكلة."},

{en:"What do you mean?", ar:"ماذا تقصد؟"},
{en:"I don't understand.", ar:"أنا لا أفهم."},
{en:"Could you repeat that?", ar:"هل يمكنك تكرار ذلك؟"},
{en:"Please speak slowly.", ar:"من فضلك تحدث ببطء."},
{en:"Give me a second.", ar:"أعطني لحظة."},

{en:"Never mind.", ar:"لا بأس / انسَ الأمر."},
{en:"Sounds good!", ar:"يبدو جيدًا!"},
{en:"That's great!", ar:"هذا رائع!"},
{en:"I agree.", ar:"أنا أوافق."},
{en:"I don't agree.", ar:"أنا لا أوافق."},

{en:"What are you doing?", ar:"ماذا تفعل؟"},
{en:"What are you talking about?", ar:"عمّ تتحدث؟"},
{en:"Are you serious?", ar:"هل أنت جاد؟"},
{en:"Of course!", ar:"بالطبع!"},
{en:"Not really.", ar:"ليس تمامًا."},

{en:"I think so.", ar:"أعتقد ذلك."},
{en:"I don't think so.", ar:"لا أعتقد ذلك."},
{en:"It depends.", ar:"هذا يعتمد."},
{en:"I'm not sure.", ar:"لست متأكدًا."},
{en:"Let me think.", ar:"دعني أفكر."},

{en:"I'm on my way.", ar:"أنا في طريقي."},
{en:"I'll be back soon.", ar:"سأعود قريبًا."},
{en:"Take your time.", ar:"خذ وقتك."},
{en:"Hurry up!", ar:"أسرع!"},
{en:"Wait a minute.", ar:"انتظر دقيقة."},

{en:"What's going on?", ar:"ماذا يحدث؟"},
{en:"That's a good idea.", ar:"هذه فكرة جيدة."},
{en:"It doesn't matter.", ar:"لا يهم."},
{en:"I have no idea.", ar:"ليس لدي أي فكرة."},
{en:"That's exactly what I mean.", ar:"هذا بالضبط ما أقصده."},

{en:"As far as I know.", ar:"على حد علمي."},
{en:"To be honest.", ar:"بصراحة."},
{en:"In my opinion.", ar:"في رأيي."},
{en:"As a matter of fact.", ar:"في الواقع."},
{en:"On the other hand.", ar:"من ناحية أخرى."},

{en:"That makes sense.", ar:"هذا منطقي."},
{en:"I see your point.", ar:"أفهم وجهة نظرك."},
{en:"I couldn't agree more.", ar:"لا يمكنني أن أوافق أكثر من ذلك."},
{en:"That's not necessarily true.", ar:"هذا ليس صحيحًا بالضرورة."}

];

const container = document.getElementById("expressions");

expressions.forEach(function(item, index) {

    const card = document.createElement("div");
    card.className = "expression";

    const number = document.createElement("div");
    number.className = "number";
    number.textContent = "التعبير " + (index + 1);

    const english = document.createElement("div");
    english.className = "english";
    english.textContent = item.en;

    const arabic = document.createElement("div");
    arabic.className = "arabic";
    arabic.textContent = item.ar;

    const button = document.createElement("button");
    button.className = "listen";
    button.type = "button";
    button.textContent = "🔊 استماع";

    button.addEventListener("click", function() {
        speak(item.en);
    });

    card.appendChild(number);
    card.appendChild(english);
    card.appendChild(arabic);
    card.appendChild(button);

    container.appendChild(card);
});


function speak(text) {

    if (!window.speechSynthesis) {
        alert("النطق الصوتي غير متاح في هذا المتصفح.");
        return;
    }

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);

    utterance.lang = "en-US";
    utterance.rate = 0.85;
    utterance.pitch = 1;
    utterance.volume = 1;

    window.speechSynthesis.speak(utterance);
}

</script>

</body>
</html>
