<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دروس الإنجليزية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef4ff,#f8fbff);color:#172033}
header{background:linear-gradient(135deg,#2563eb,#4f46e5);color:white;text-align:center;padding:30px 18px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:29px}
.container{max-width:900px;margin:auto;padding:22px 16px}.back{display:inline-block;background:white;color:#2563eb;text-decoration:none;padding:10px 17px;border-radius:12px;margin-bottom:20px}
.lesson-number{text-align:center;color:#667085;margin-bottom:12px;font-weight:bold}.lesson{background:white;border-radius:22px;padding:25px 20px;box-shadow:0 8px 25px rgba(30,60,100,.10)}.lesson h2{color:#2563eb;margin-top:0}
.goal,.explanation,.example,.practice{padding:16px;border-radius:14px;line-height:1.9}.goal{background:#eef4ff;margin-bottom:20px}.section{margin-top:25px}.section h3{color:#2563eb}.explanation{background:#f8fafc}.example{background:#eef4ff;margin:12px 0}
.english{direction:ltr;text-align:left;font-size:19px;font-weight:bold}.arabic{margin-top:7px}.listen{display:block;margin:18px auto;border:none;background:#2563eb;color:white;padding:12px 24px;border-radius:12px;font-size:16px;cursor:pointer}
.words{margin-top:25px}.word{background:#f8fafc;padding:12px;margin:8px 0;border-radius:10px;line-height:1.7}.practice{background:#fff7ed}
.navigation{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.navigation button{flex:1;border:none;background:#2563eb;color:white;padding:12px;border-radius:12px;cursor:pointer;font-size:15px}.navigation button:disabled{background:#b7c1d1}
#status{text-align:center;min-height:22px;color:#2563eb;font-size:14px}footer{text-align:center;padding:30px;color:#667085}
</style></head>
<body>
<header><h1>📚 دروس الإنجليزية</h1><p>My English Lessons</p></header>
<div class="container"><a class="back" href="index.html">← العودة إلى الرئيسية</a>
<div class="lesson-number" id="lessonNumber"></div>
<div class="lesson"><h2 id="title"></h2>
<div class="goal"><strong>🎯 هدف الدرس:</strong><div id="goal"></div></div>
<div class="section"><h3>📖 شرح الدرس</h3><div class="explanation" id="explanation"></div></div>
<div class="section"><h3>💬 أمثلة</h3><div id="examples"></div></div>
<button class="listen" onclick="listenLesson()">🔊 استمع إلى أمثلة الدرس</button><div id="status"></div>
<div class="words"><h3>🧠 كلمات مهمة</h3><div id="wordsList"></div></div>
<div class="section"><h3>✏️ تدريب</h3><div class="practice" id="practice"></div></div>
</div>
<div class="navigation"><button id="previous" onclick="previousLesson()">⬅️ السابق</button><button id="next" onclick="nextLesson()">التالي ➡️</button></div>
</div><footer>My English Notebook © 2026</footer>
<script>
const lessons=[
{
title:"Lesson 1 — Personal Pronouns",
goal:"تعلم الضمائر الشخصية الأساسية.",
explanation:`الضمائر هي كلمات نستخدمها بدل الأسماء.`,
examples:[
{english:"I am a student.",arabic:"أنا طالب."},
{english:"She is a student.",arabic:"هي طالبة."},
{english:"They are friends.",arabic:"هم أصدقاء."}
],
words:[
"I = أنا",
"You = أنت / أنتم",
"He = هو",
"She = هي",
"We = نحن",
"They = هم / هن"
],
practice:`استخدم I وYou وHe وShe في جمل بسيطة.`
},

{
title:"Lesson 2 — Verb To Be: am / is / are",
goal:"تعلم استخدام am وis وare.",
explanation:`مع I نستخدم am، ومع He/She/It نستخدم is، ومع You/We/They نستخدم are.`,
examples:[
{english:"I am ready.",arabic:"أنا مستعد."},
{english:"He is happy.",arabic:"هو سعيد."},
{english:"They are students.",arabic:"هم طلاب."}
],
words:[
"am = أكون",
"is = يكون",
"are = يكون / يكونون",
"happy = سعيد",
"ready = مستعد"
],
practice:`أكمل: I ___ ready. She ___ happy. They ___ students.`
},

{
title:"Lesson 3 — To Be: Negative and Questions",
goal:"تعلم النفي والسؤال باستخدام am/is/are.",
explanation:`للنفي نضع not، وللسؤال نضع am أو is أو are في البداية.`,
examples:[
{english:"I am not tired.",arabic:"أنا لست متعبًا."},
{english:"She is not busy.",arabic:"هي ليست مشغولة."},
{english:"Are you ready?",arabic:"هل أنت مستعد؟"}
],
words:[
"not = ليس / لا",
"tired = متعب",
"busy = مشغول",
"ready = مستعد"
],
practice:`حوّل: I am happy إلى النفي ثم إلى سؤال.`
},

{
title:"Lesson 4 — Possessive Adjectives",
goal:"تعلم my وyour وhis وher وour وtheir.",
explanation:`تأتي صفات الملكية قبل الاسم.`,
examples:[
{english:"My name is Ahmed.",arabic:"اسمي أحمد."},
{english:"His book is new.",arabic:"كتابه جديد."},
{english:"Our school is big.",arabic:"مدرستنا كبيرة."},
{english:"Their house is beautiful.",arabic:"منزلهم جميل."}
],
words:[
"my = ـي",
"your = ـك",
"his = ـه",
"her = ـها",
"our = ـنا",
"their = ـهم"
],
practice:`أكمل: I have a book. It is ___ book.`
},

{
title:"Lesson 5 — Singular, Plural and Articles",
goal:"تعلم المفرد والجمع وa وan وthe.",
explanation:`المفرد شيء واحد، والجمع غالبًا بإضافة s. نستخدم a أو an مع الاسم المفرد غير المحدد.`,
examples:[
{english:"This is a book.",arabic:"هذا كتاب."},
{english:"This is an apple.",arabic:"هذه تفاحة."},
{english:"I have two books.",arabic:"لدي كتابان."}
],
words:[
"book = كتاب",
"books = كتب",
"apple = تفاحة",
"two = اثنان",
"the = الـ"
],
practice:`اختر a أو an: ___ book، ___ apple، ___ student.`
},

{
title:"Lesson 6 — Have and Has",
goal:"تعلم have وhas للتعبير عن الملكية.",
explanation:`نستخدم have مع I/You/We/They، وhas مع He/She/It.`,
examples:[
{english:"I have a book.",arabic:"لدي كتاب."},
{english:"He has a car.",arabic:"لديه سيارة."},
{english:"She has a bag.",arabic:"لديها حقيبة."}
],
words:[
"have = لديه / يملك",
"has = لديه / يملك",
"car = سيارة",
"bag = حقيبة"
],
practice:`اختر have أو has: I ___ a book. She ___ a phone.`
},

{
title:"Lesson 7 — Present Simple",
goal:"التعرف على المضارع البسيط للعادات والروتين.",
explanation:`مع I/You/We/They نستخدم الفعل الأساسي، ومع He/She/It نضيف غالبًا s.`,
examples:[
{english:"I study English.",arabic:"أدرس الإنجليزية."},
{english:"We study every day.",arabic:"نحن ندرس كل يوم."},
{english:"He works every day.",arabic:"هو يعمل كل يوم."},
{english:"She studies English.",arabic:"هي تدرس الإنجليزية."}
],
words:[
"study = يدرس",
"work = يعمل",
"speak = يتحدث",
"every day = كل يوم"
],
practice:`اكتب جملة عن عادة لديك باستخدام I.`
},

{
title:"Lesson 8 — Present Simple Negative",
goal:"تعلم النفي باستخدام don't وdoesn't.",
explanation:`نستخدم don't مع I/You/We/They وdoesn't مع He/She/It.`,
examples:[
{english:"I don't speak French.",arabic:"أنا لا أتحدث الفرنسية."},
{english:"We don't study at night.",arabic:"نحن لا ندرس في الليل."},
{english:"He doesn't work here.",arabic:"هو لا يعمل هنا."}
],
words:[
"don't = لا",
"doesn't = لا",
"night = الليل",
"work = يعمل"
],
practice:`حوّل: I speak English. He works here.`
},

{
title:"Lesson 9 — Present Simple Questions",
goal:"تعلم الأسئلة باستخدام Do وDoes.",
explanation:`نستخدم Do مع I/You/We/They وDoes مع He/She/It.`,
examples:[
{english:"Do you speak English?",arabic:"هل تتحدث الإنجليزية؟"},
{english:"Do they work here?",arabic:"هل هم يعملون هنا؟"},
{english:"Does he study?",arabic:"هل هو يدرس؟"}
],
words:[
"do = أداة سؤال",
"does = أداة سؤال",
"here = هنا",
"study = يدرس"
],
practice:`حوّل إلى سؤال: You speak English. He works here.`
},

{
title:"Lesson 10 — My Daily Life",
goal:"تطبيق القواعد السابقة في الحياة اليومية.",
explanation:`استخدم To Be وhave وPresent Simple والنفي والأسئلة للحديث عن حياتك.`,
examples:[
{english:"My name is Ahmed.",arabic:"اسمي أحمد."},
{english:"I am a student.",arabic:"أنا طالب."},
{english:"I study English every day.",arabic:"أدرس الإنجليزية كل يوم."},
{english:"I don't study at night.",arabic:"لا أدرس في الليل."}
],
words:[
"daily life = الحياة اليومية",
"student = طالب",
"study = يدرس",
"night = الليل"
],
practice:`تحدث عن نفسك من 5 إلى 8 جمل.`
},

{
title:"Lesson 11 — Present Continuous",
goal:"تعلم المضارع المستمر لشيء يحدث الآن.",
explanation:`نستخدم am/is/are + verb-ing للحديث عما يحدث الآن.`,
examples:[
{english:"I am studying now.",arabic:"أنا أدرس الآن."},
{english:"She is reading a book.",arabic:"هي تقرأ كتابًا."},
{english:"They are playing football.",arabic:"هم يلعبون كرة القدم."}
],
words:[
"now = الآن",
"study = يدرس",
"read = يقرأ",
"play = يلعب"
],
practice:`اكتب جملتين عن أشياء تحدث الآن.`
},

{
title:"Lesson 12 — Present Continuous Negative",
goal:"تعلم النفي في المضارع المستمر.",
explanation:`نضع not بعد am/is/are.`,
examples:[
{english:"I am not sleeping.",arabic:"أنا لا أنام الآن."},
{english:"He is not working.",arabic:"هو لا يعمل الآن."},
{english:"They aren't playing.",arabic:"هم لا يلعبون."}
],
words:[
"sleep = ينام",
"work = يعمل",
"playing = يلعب"
],
practice:`حوّل: I am studying إلى النفي.`
},

{
title:"Lesson 13 — Present Continuous Questions",
goal:"تعلم تكوين الأسئلة في المضارع المستمر.",
explanation:`نضع am/is/are في بداية السؤال ثم الفاعل والفعل مع ing.`,
examples:[
{english:"Are you studying English?",arabic:"هل تدرس الإنجليزية؟"},
{english:"Is he working now?",arabic:"هل هو يعمل الآن؟"},
{english:"Are they playing?",arabic:"هل هم يلعبون؟"}
],
words:[
"question = سؤال",
"working = يعمل",
"playing = يلعب"
],
practice:`حوّل: You are studying إلى سؤال.`
},

{
title:"Lesson 14 — Can and Cannot",
goal:"تعلم can وcannot للتعبير عن القدرة.",
explanation:`نستخدم can للقدرة وcannot أو can't لعدم القدرة، وبعد can يأتي الفعل الأساسي.`,
examples:[
{english:"I can speak English.",arabic:"أستطيع التحدث بالإنجليزية."},
{english:"He can swim.",arabic:"هو يستطيع السباحة."},
{english:"I can't drive.",arabic:"لا أستطيع القيادة."},
{english:"Can you read English?",arabic:"هل تستطيع قراءة الإنجليزية؟"}
],
words:[
"can = يستطيع",
"cannot = لا يستطيع",
"swim = يسبح",
"drive = يقود"
],
practice:`اكتب: I can... وI can't...`
},

{
title:"Lesson 15 — There is and There are",
goal:"تعلم الحديث عن وجود الأشياء.",
explanation:`There is للمفرد وThere are للجمع.`,
examples:[
{english:"There is a book on the table.",arabic:"يوجد كتاب على الطاولة."},
{english:"There is a computer in the room.",arabic:"يوجد حاسوب في الغرفة."},
{english:"There are two books.",arabic:"يوجد كتابان."}
],
words:[
"there is = يوجد للمفرد",
"there are = يوجد للجمع",
"table = طاولة",
"computer = حاسوب"
],
practice:`أكمل: ___ a book. ___ two students.`
},

{
title:"Lesson 16 — This, That, These and Those",
goal:"تعلم أسماء الإشارة للمفرد والجمع.",
explanation:`This للمفرد القريب، That للمفرد البعيد، These للجمع القريب، Those للجمع البعيد.`,
examples:[
{english:"This is my book.",arabic:"هذا كتابي."},
{english:"That is your phone.",arabic:"ذلك هاتفك."},
{english:"These are my books.",arabic:"هذه كتبي."},
{english:"Those are your shoes.",arabic:"تلك أحذيتك."}
],
words:[
"this = هذا / هذه",
"that = ذلك / تلك",
"these = هؤلاء / هذه",
"those = أولئك / تلك"
],
practice:`كوّن أربع جمل باستخدام This وThat وThese وThose.`
},

{
title:"Lesson 17 — Prepositions of Place",
goal:"تعلم in وon وunder وnext to.",
explanation:`تستخدم حروف الجر لوصف مكان الأشياء.`,
examples:[
{english:"The book is on the table.",arabic:"الكتاب على الطاولة."},
{english:"The phone is in the bag.",arabic:"الهاتف داخل الحقيبة."},
{english:"The shoes are under the bed.",arabic:"الأحذية تحت السرير."},
{english:"The school is next to my house.",arabic:"المدرسة بجانب منزلي."}
],
words:[
"in = في / داخل",
"on = على",
"under = تحت",
"next to = بجانب"
],
practice:`صف مكان ثلاثة أشياء حولك.`
},

{
title:"Lesson 18 — Question Words",
goal:"تعلم What وWhere وWho وWhen وWhy وHow.",
explanation:`هذه الكلمات تساعدنا على تكوين أسئلة تفصيلية.`,
examples:[
{english:"What is your name?",arabic:"ما اسمك؟"},
{english:"Where do you live?",arabic:"أين تعيش؟"},
{english:"Who is your teacher?",arabic:"من هو معلمك؟"},
{english:"When do you study?",arabic:"متى تدرس؟"},
{english:"Why are you happy?",arabic:"لماذا أنت سعيد؟"},
{english:"How are you?",arabic:"كيف حالك؟"}
],
words:[
"what = ماذا / ما",
"where = أين",
"who = من",
"when = متى",
"why = لماذا",
"how = كيف"
],
practice:`كوّن سؤالًا باستخدام What وWhere وHow.`
},

{
title:"Lesson 19 — Adverbs of Frequency",
goal:"تعلم always وusually وsometimes وnever.",
explanation:`كلمات التكرار تصف عدد مرات حدوث الشيء.`,
examples:[
{english:"I always study English.",arabic:"أدرس الإنجليزية دائمًا."},
{english:"I usually wake up early.",arabic:"عادةً أستيقظ مبكرًا."},
{english:"I sometimes watch TV.",arabic:"أحيانًا أشاهد التلفاز."},
{english:"I never study late.",arabic:"لا أدرس أبدًا متأخرًا."}
],
words:[
"always = دائمًا",
"usually = عادةً",
"sometimes = أحيانًا",
"never = أبدًا"
],
practice:`كوّن أربع جمل عن عاداتك باستخدام كلمات التكرار.`
},

{
title:"Lesson 20 — Daily Routine Conversation",
goal:"تطبيق القواعد في الحديث عن الروتين اليومي.",
explanation:`تحدث عن الاستيقاظ والدراسة والطعام ووقت الفراغ والنوم.`,
examples:[
{english:"I usually wake up at seven.",arabic:"عادةً أستيقظ في الساعة السابعة."},
{english:"I have breakfast in the morning.",arabic:"أتناول الإفطار في الصباح."},
{english:"I study English every day.",arabic:"أدرس الإنجليزية كل يوم."},
{english:"I am studying now.",arabic:"أنا أدرس الآن."},
{english:"I usually go to bed at eleven.",arabic:"عادةً أذهب إلى النوم في الساعة الحادية عشرة."}
],
words:[
"daily routine = الروتين اليومي",
"wake up = يستيقظ",
"breakfast = الإفطار",
"now = الآن",
"go to bed = يذهب إلى النوم"
],
practice:`تحدث عن يومك باستخدام 5 إلى 8 جمل.`
}
];
let currentLesson=0;
function showLesson(){
const lesson=lessons[currentLesson];
document.getElementById("lessonNumber").textContent="الدرس "+(currentLesson+1)+" من "+lessons.length;
document.getElementById("title").textContent=lesson.title;
document.getElementById("goal").textContent=lesson.goal;
document.getElementById("explanation").innerHTML=lesson.explanation;
const examples=document.getElementById("examples");examples.innerHTML="";
lesson.examples.forEach(function(example){const div=document.createElement("div");div.className="example";div.innerHTML='<div class="english">'+example.english+'</div><div class="arabic">'+example.arabic+'</div>';examples.appendChild(div);});
const list=document.getElementById("wordsList");list.innerHTML="";
lesson.words.forEach(function(word){const div=document.createElement("div");div.className="word";div.textContent=word;list.appendChild(div);});
document.getElementById("practice").innerHTML=lesson.practice;
document.getElementById("previous").disabled=currentLesson===0;
document.getElementById("next").disabled=currentLesson===lessons.length-1;
document.getElementById("status").textContent="";
}
function nextLesson(){if(currentLesson<lessons.length-1){currentLesson++;showLesson();window.scrollTo(0,0);}}
function previousLesson(){if(currentLesson>0){currentLesson--;showLesson();window.scrollTo(0,0);}}
function listenLesson(){
const text=lessons[currentLesson].examples.map(example=>example.english).join(". ");
const status=document.getElementById("status");
if(!("speechSynthesis" in window)){status.textContent="⚠️ المتصفح لا يدعم الاستماع الصوتي.";return;}
window.speechSynthesis.cancel();const speech=new SpeechSynthesisUtterance(text);speech.lang="en-US";speech.rate=.8;speech.pitch=1;
speech.onstart=function(){status.textContent="🔊 جاري الاستماع إلى أمثلة الدرس...";};
speech.onend=function(){status.textContent="✅ انتهى الاستماع.";};speech.onerror=function(){status.textContent="⚠️ تعذر تشغيل الصوت.";};window.speechSynthesis.speak(speech);
}
showLesson();
</script></body></html>
