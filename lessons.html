<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دروس الإنجليزية | My English Notebook</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef4ff,#f8fbff);color:#172033}
header{background:linear-gradient(135deg,#2563eb,#4f46e5);color:white;text-align:center;padding:28px 15px;border-radius:0 0 28px 28px}
header h1{margin:0;font-size:28px} header p{margin:8px 0 0}
.container{max-width:950px;margin:auto;padding:18px 15px}
.back{display:inline-block;background:white;color:#2563eb;text-decoration:none;padding:10px 16px;border-radius:12px;margin-bottom:15px}
.dashboard,.lesson{background:white;border-radius:20px;box-shadow:0 7px 22px rgba(0,0,0,.08)}
.dashboard{padding:18px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:#f5f7ff;padding:13px;border-radius:14px;text-align:center}
.stat strong{display:block;font-size:21px;color:#2563eb;margin-bottom:5px}
.progress-bg{height:13px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-top:12px}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:.4s}
.lesson{padding:20px;margin-bottom:18px}.lesson.locked{opacity:.7}
.lesson h2{margin-top:0;color:#2563eb;font-size:22px}
.status{display:inline-block;padding:7px 11px;border-radius:10px;font-weight:bold;font-size:14px;margin-bottom:12px}
.locked-status{background:#f3f4f6;color:#6b7280}.open-status{background:#eef4ff;color:#2563eb}.mastered-status{background:#ecfdf5;color:#047857}
.goal{background:#eef4ff;padding:12px;border-radius:12px;line-height:1.8}
.explanation{line-height:2;white-space:pre-line;margin-top:14px}
.example{background:#f8fafc;padding:14px;border-radius:14px;margin-top:10px}
.example-en{direction:ltr;text-align:left;font-weight:bold;font-size:18px}.example-ar{margin-top:7px}
.words{background:#f5f3ff;padding:14px;border-radius:14px;margin-top:14px;line-height:2}
.practice{background:#ecfdf5;padding:14px;border-radius:14px;margin-top:14px;line-height:1.9}
button{border:0;cursor:pointer;font-family:inherit}.test-button{background:#047857;color:white;padding:12px 18px;border-radius:12px;margin-top:15px;font-weight:bold;font-size:16px}
.test-button:hover{background:#065f46}.disabled{background:#9ca3af!important;cursor:not-allowed}.hidden{display:none}
.test-box{margin-top:18px;background:#f8fafc;padding:18px;border-radius:18px;border:2px solid #e5e7eb}
.question{font-size:18px;font-weight:bold;line-height:1.7;margin-bottom:15px}
.answers{display:grid;gap:10px}.answer{background:white;border:2px solid #e5e7eb;padding:12px;border-radius:12px;text-align:right;font-size:16px}
.result{padding:14px;border-radius:14px;margin-top:15px;font-weight:bold;line-height:1.8}
.success{background:#ecfdf5;color:#047857}.fail{background:#fef2f2;color:#b91c1c}
.limit{background:#fff7ed;color:#c2410c;padding:12px;border-radius:12px;margin-top:12px;line-height:1.7}
.timer{
background:#eff6ff;
color:#1d4ed8;
padding:12px;
border-radius:12px;
margin:12px 0;
font-weight:bold;
text-align:center;
}
.timer.warning{background:#fff7ed;color:#c2410c}
.timer.danger{background:#fef2f2;color:#b91c1c}

.voice-box{background:#f5f3ff;padding:15px;border-radius:14px;margin-top:14px}
.voice-target{direction:ltr;text-align:center;font-size:21px;font-weight:bold;margin:12px 0}
.voice-result{margin-top:10px;font-weight:bold}
.sound{background:#2563eb;color:white;padding:9px 14px;border-radius:10px;margin-top:9px}
.sound:hover{background:#1d4ed8}.speak{background:#7c3aed;color:white;padding:9px 14px;border-radius:10px;margin-top:9px;margin-right:5px}
footer{text-align:center;padding:30px;color:#667085}
@media(max-width:600px){.stats{grid-template-columns:1fr}}
</style>

<script>
const lessons=[
{

words:["my = ـي","your = ـك","his = ـه","her = ـها","our = ـنا","their = ـهم"],

{q:"___ name is Ahmed.",a:["My","Me","I","Mine"],correct:0},{q:"This is ___ book.",a:["she","her","hers","he"],correct:1},{q:"We love ___ school.",a:["our","us","we","ours"],correct:0},{q:"They have ___ house.",a:["them","their","they","theirs"],correct:1},{q:"his تعني؟",a:["ـها","ـه","ـنا","ـهم"],correct:1}]
},

These = هذه / هؤلاء للجمع القريب.

examples:[{english:"This is my book.",arabic:"هذا كتابي."},{english:"That is your phone.",arabic:"ذلك هاتفك."},{english:"These are my friends.",arabic:"هؤلاء أصدقائي."}],

},
{

examples:[{english:"I have a book.",arabic:"لدي كتاب."},{english:"She has an apple.",arabic:"لديها تفاحة."},{english:"The book is new.",arabic:"الكتاب جديد."}],

{q:"___ apple",a:["a","an","the","no"],correct:1},{q:"___ book",a:["an","a","are","is"],correct:1},{q:"___ English lesson",a:["a","an","is","are"],correct:1},{q:"The تستخدم غالبًا عندما يكون الشيء:",a:["محددًا أو معروفًا","جمعًا فقط","فعلًا","ضميرًا"],correct:0},{q:"a book تعني:",a:["كتاب محدد","كتاب / واحد من الكتب","الكتب","كتب"],correct:1}]
},
{

words:["have = لديه / يملك","has = لديه / يملك","phone = هاتف","car = سيارة","house = منزل"],
practice:"أكمل: I __ a book. He __ a car. They __ a house.",
test:[
{q:"I ___ a book.",a:["has","have","having","had"],correct:1},{q:"He ___ a car.",a:["have","has","having","had"],correct:1},{q:"They ___ a house.",a:["has","have","having","had"],correct:1},{q:"She ___ a phone.",a:["have","has","having","had"],correct:1},{q:"We ___ two books.",a:["has","have","having","had"],correct:1}]
},
{
title:"Lesson 10 — There Is and There Are",goal:"التعبير عن وجود شيء أو عدة أشياء.",
explanation:`There is تستخدم مع المفرد.

There are two books.`,
examples:[{english:"There is a book on the table.",arabic:"يوجد كتاب على الطاولة."},{english:"There is a student here.",arabic:"يوجد طالب هنا."},{english:"There are two chairs.",arabic:"يوجد كرسيان."}],
words:["there is = يوجد للمفرد","there are = يوجد للجمع","table = طاولة","chair = كرسي","room = غرفة"],

{q:"___ a book.",a:["There are","There is","There am","There be"],correct:1},{q:"___ two chairs.",a:["There is","There are","There am","There be"],correct:1},{q:"للمفرد نستخدم:",a:["There are","There is","They are","It are"],correct:1},{q:"للجمع نستخدم:",a:["There is","There are","There am","It is"],correct:1},{q:"There are two books تعني:",a:["يوجد كتاب","يوجد كتابان","الكتاب جديد","لدي كتاب"],correct:1}]

ادرس الشرح والأمثلة والمفردات، ثم اختبر نفسك.

examples:[
{english:"I practice English every day.",arabic:"أتدرب على الإنجليزية كل يوم."},
{english:"I want to improve my English.",arabic:"أريد تحسين لغتي الإنجليزية."},
{english:"Practice helps me learn.",arabic:"التدريب يساعدني على التعلم."}],
words:["practice = يتدرب","learn = يتعلم","improve = يتحسن","English = الإنجليزية"],
practice:"استخدم الكلمات والجمل الجديدة في جمل من إنشائك.",

{q:"ما معنى practice؟",a:["يتدرب","ينام","يأكل","يذهب"],correct:0},
{q:"اختر الجملة الصحيحة.",a:["I practice English every day.","I practices English every day.","I practicing English every day.","I am practice English every day."],correct:0},
{q:"ما معنى improve؟",a:["ينسى","يتحسن","يكتب","يسافر"],correct:1},
{q:"اختر الجملة الصحيحة.",a:["I want improve.","I want to improve my English.","I want improving English.","I to want improve English."],correct:1},
{q:"Practice helps me ___.",a:["learn","learns","learning","learned"],correct:0}]

const STORAGE_KEY="myEnglishNotebookMasteryV2";
let data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
if(!data)data={mastered:[],testsDate:"",testsToday:0};
if(!Array.isArray(data.mastered))data.mastered=[];
if(typeof data.testsToday!=="number")data.testsToday=0;

function today(){return new Date().toISOString().slice(0,10)}
function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function resetDailyTests(){if(data.testsDate!==today()){data.testsDate=today();data.testsToday=0;saveData()}}
function isMastered(i){return data.mastered.includes(i)}
function isUnlocked(i){return i===0||isMastered(i-1)}

function updateDashboard(){
resetDailyTests();
const mastered=data.mastered.length, percent=Math.round(mastered/lessons.length*100);
document.getElementById("masteredCount").textContent=mastered;
document.getElementById("lessonCount").textContent=lessons.length;
document.getElementById("testsToday").textContent=data.testsToday+" / 10";
document.getElementById("progressText").textContent=percent+"%";
document.getElementById("progressFill").style.width=percent+"%";
document.getElementById("dailyLimitMessage").innerHTML=data.testsToday>=10?
`<div class="limit">⏰ وصلت إلى الحد الأقصى: <strong>10 اختبارات اليوم</strong>.<br>يمكنك مراجعة الدروس، وسيعود الاختبار غدًا.</div>`:"";
}

function speak(text){
if(!("speechSynthesis" in window)){alert("متصفحك لا يدعم النطق الصوتي.");return}
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.78;speechSynthesis.speak(u);
}

let pronunciationResults={};

function cleanText(s){return s.toLowerCase().replace(/[.,!?;:'"]/g,"").replace(/\s+/g," ").trim()}

function startPronunciation(text,elementId,type,index){
const result=document.getElementById(elementId);
if(!("SpeechRecognition" in window)&&!("webkitSpeechRecognition" in window)){
result.innerHTML="⚠️ متصفحك لا يدعم التعرف على الصوت.";
return;
}
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const recognition=new Recognition();
recognition.lang="en-US";recognition.interimResults=false;recognition.maxAlternatives=3;
result.innerHTML="🎤 تحدث الآن...";
try{recognition.start()}catch(e){result.innerHTML="⚠️ حاول مرة أخرى."}

recognition.onresult=function(event){
let spoken=event.results[0][0].transcript;
const a=cleanText(spoken),b=cleanText(text);
let ok=false;
if(!b.includes(" ")){ok=a===b||a.includes(b)||b.includes(a)}
else{
const target=b.split(" "), heard=a.split(" ");
let matches=0;
target.forEach(w=>{if(heard.includes(w))matches++});
ok=matches/target.length>=.75;
}
if(ok){
result.innerHTML="✅ النطق مقبول!";
result.className="voice-result success";
if(!pronunciationResults[index])pronunciationResults[index]={word:false,sentence:false};
pronunciationResults[index][type]=true;
}else{
result.innerHTML="🔄 سُمع: "+spoken+"<br>حاول مرة أخرى.";
result.className="voice-result fail";
}
}
recognition.onerror=function(){result.innerHTML="⚠️ لم يتم التعرف على صوتك. حاول مرة أخرى."}
}

function displayLessons(){
resetDailyTests();
const container=document.getElementById("lessons");container.innerHTML="";
lessons.forEach((lesson,index)=>{
const unlocked=isUnlocked(index),mastered=isMastered(index);
const card=document.createElement("article");card.className="lesson"+(!unlocked?" locked":"");
let status=mastered?`<div class="status mastered-status">✅ متقن</div>`:unlocked?`<div class="status open-status">🔓 مفتوح</div>`:`<div class="status locked-status">🔒 مقفل — أتقن الدرس السابق</div>`;
let examplesHTML="";
lesson.examples.forEach(example=>{examplesHTML+=`<div class="example"><div class="example-en">${example.english}</div><div class="example-ar">${example.arabic}</div><button class="sound" onclick='speak(${JSON.stringify(example.english)})'>🔊 استمع</button></div>`});
let wordsHTML=lesson.words.map(w=>`<div>• ${w}</div>`).join("");
let testButton=mastered?`<button class="test-button disabled" disabled>✅ تم إتقان هذا الدرس</button>`:
!unlocked?`<button class="test-button disabled" disabled>🔒 أكمل الدرس السابق أولًا</button>`:
data.testsToday>=10?`<button class="test-button disabled" disabled>⏰ انتهت اختبارات اليوم</button>`:
`<button class="test-button" onclick="openTest(${index})">🧠 ابدأ اختبار الإتقان</button>`;
card.innerHTML=`${status}<h2>📘 ${lesson.title}</h2>
<div class="goal"><strong>🎯 هدف الدرس:</strong><br>${lesson.goal}</div>
<div class="explanation"><strong>📖 الشرح:</strong><br>${lesson.explanation}</div>
<div><strong>💬 الأمثلة:</strong>${examplesHTML}</div>
<div class="words"><strong>🧠 المفردات:</strong>${wordsHTML}</div>
<div class="practice"><strong>✍️ التدريب:</strong><br>${lesson.practice}</div>
${testButton}<div id="test-${index}" class="test-box hidden"></div>`;
container.appendChild(card);
});
}

let activeTestTimer=null;
let activeTestIndex=null;
let activeTestSeconds=0;

function getTestTime(index){
if(index<10)return 90;
if(index<25)return 120;
if(index<40)return 150;
return 180;
}

function stopTestTimer(){
if(activeTestTimer){
clearInterval(activeTestTimer);
activeTestTimer=null;
}
activeTestIndex=null;
activeTestSeconds=0;
}

function startTestTimer(index){
stopTestTimer();
activeTestIndex=index;
activeTestSeconds=getTestTime(index);
const timer=document.getElementById("timer-"+index);
if(!timer)return;

function paint(){
const m=Math.floor(activeTestSeconds/60);
const s=String(activeTestSeconds%60).padStart(2,"0");
timer.textContent=`⏱️ الوقت المتبقي: ${m}:${s}`;
timer.className="timer"+(activeTestSeconds<=15?" danger":activeTestSeconds<=30?" warning":"");
}

paint();
activeTestTimer=setInterval(()=>{
activeTestSeconds--;
paint();
if(activeTestSeconds<=0){
stopTestTimer();
const result=document.getElementById("result-"+index);
if(result)result.innerHTML=`<div class="result fail">⏰ انتهى وقت الاختبار. لم يتم اجتياز الاختبار.<br>سيُعاد التقدم إلى الصفر حسب نظام الإتقان.</div>`;
submitTest(index,true);
}
},1000);
}

function openTest(index){
resetDailyTests();
if(data.testsToday>=10){alert("لقد وصلت إلى 10 اختبارات اليوم.");return}
if(!isUnlocked(index)||isMastered(index))return;
const box=document.getElementById("test-"+index),lesson=lessons[index];
pronunciationResults[index]={word:false,sentence:false};
const word=lesson.words[Math.floor(Math.random()*lesson.words.length)].split("=")[0].trim();
const sentence=lesson.examples[Math.floor(Math.random()*lesson.examples.length)].english;
box.classList.remove("hidden");
box.innerHTML=`<h3>🧠 اختبار إتقان Lesson ${index+1}</h3>
<p>تحتاج إلى <strong>80%</strong> على الأقل. الوقت مناسب لمستوى الدرس. إذا لم تنجح، ستعيد <strong>هذا الاختبار فقط</strong> دون فقدان تقدمك السابق.</p>
<div id="timer-${index}" class="timer">⏱️ الوقت المتبقي</div>
<div id="questions-${index}"></div>
<button class="test-button" onclick="submitTest(${index})">✅ إنهاء الاختبار</button>
<div id="result-${index}"></div>`;
const questions=document.getElementById("questions-"+index);
questions.innerHTML+=`<div class="voice-box"><h3>🎤 اختبار النطق — كلمة</h3><p>استمع أولًا ثم انطق الكلمة.</p>
<div class="voice-target">${word}</div>
<button class="sound" onclick='speak(${JSON.stringify(word)})'>🔊 استمع</button>
<button class="speak" onclick='startPronunciation(${JSON.stringify(word)},"pron-word-${index}","word",${index})'>🎤 انطق</button>
<div id="pron-word-${index}" class="voice-result"></div></div>`;
questions.innerHTML+=`<div class="voice-box"><h3>🎤 اختبار النطق — جملة</h3><p>استمع أولًا ثم انطق الجملة كاملة.</p>
<div class="voice-target">${sentence}</div>
<button class="sound" onclick='speak(${JSON.stringify(sentence)})'>🔊 استمع</button>
<button class="speak" onclick='startPronunciation(${JSON.stringify(sentence)},"pron-sentence-${index}","sentence",${index})'>🎤 انطق</button>
<div id="pron-sentence-${index}" class="voice-result"></div></div>`;
lesson.test.forEach((q,qIndex)=>{
let answers=q.a.map((answer,aIndex)=>`<label class="answer"><input type="radio" name="q-${index}-${qIndex}" value="${aIndex}"> ${answer}</label>`).join("");
questions.innerHTML+=`<div style="background:white;padding:15px;border-radius:14px;margin-bottom:12px;line-height:2"><div class="question">${qIndex+1}. ${q.q}</div><div class="answers">${answers}</div></div>`;
});
box.scrollIntoView({behavior:"smooth",block:"start"});
startTestTimer(index);
}

function submitTest(index, timedOut=false){
resetDailyTests();
if(activeTestIndex===index)stopTestTimer();
if(data.testsToday>=10 && !timedOut){alert("لقد وصلت إلى الحد الأقصى اليوم.");return}
const lesson=lessons[index];
if(document.getElementById("result-"+index)?.dataset.submitted==="1")return;
const result=document.getElementById("result-"+index);
if(result)result.dataset.submitted="1";
let score=0;
lesson.test.forEach((q,qIndex)=>{
const selected=document.querySelector(`input[name="q-${index}-${qIndex}"]:checked`);
if(selected&&Number(selected.value)===q.correct)score++;
});
const voice=pronunciationResults[index]||{word:false,sentence:false};
const total=lesson.test.length+2;
const finalScore=score+(voice.word?1:0)+(voice.sentence?1:0);
const percent=Math.round(finalScore/total*100);
data.testsToday++;
if(percent>=80){
if(!data.mastered.includes(index))data.mastered.push(index);
saveData();
result.innerHTML=`<div class="result success">🎉 ممتاز!<br>النتيجة: ${finalScore} / ${total} — ${percent}%<br>🏆 لقد أتقنت الدرس!<br>${index+1<lessons.length?`🔓 تم فتح Lesson ${index+2}.`:"🎓 مبروك! لقد أكملت جميع الدروس!"}</div>`;
 }else{
data.mastered=data.mastered.filter(i=>i!==index);
saveData();
result.innerHTML=`<div class="result fail">📚 لم تصل إلى درجة الإتقان بعد.<br>النتيجة: ${finalScore} / ${total} — ${percent}%<br>تحتاج إلى 80% على الأقل.<br>🔄 بقيت الدروس التي أتقنتها محفوظة، وستعيد <strong>هذا الاختبار فقط</strong> حتى تنجح.<br>${!voice.word||!voice.sentence?"🎤 يجب أيضًا اجتياز اختبار النطق للكلمة والجملة.":""}</div>`;
}
updateDashboard();
setTimeout(()=>displayLessons(),700);
}

resetDailyTests();updateDashboard();displayLessons();
</script>
</body>
</html>
