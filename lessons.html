<style>

*{

}

body{

font-family:Arial,sans-serif;
background:linear-gradient(135deg,#eef4ff,#f8fbff);

}

header{

color:white;
text-align:center;
padding:32px 15px;
border-radius:0 0 30px 30px;
}

header h1{
margin:0;
font-size:30px;
}

header p{

margin-top:10px;
}

.container{

margin:auto;
padding:20px 15px;
}

.back{
display:inline-block;
background:white;
color:#2563eb;
text-decoration:none;
padding:11px 18px;
border-radius:13px;
margin-bottom:18px;
box-shadow:0 5px 15px rgba(0,0,0,.06);
}

.intro{
background:white;
padding:20px;
border-radius:20px;
line-height:1.9;
box-shadow:0 7px 22px rgba(0,0,0,.08);

}

.progress{
background:white;
padding:18px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 7px 22px rgba(0,0,0,.07);
}

.progress-title{
font-weight:bold;
color:#2563eb;
font-size:18px;
}

.progress-track{
height:14px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
margin-top:12px;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#2563eb,#4f46e5);
transition:.4s;
}

.progress-text{
margin:10px 0 0;
font-weight:bold;
text-align:center;
}

.lessons{
display:grid;
gap:20px;
}

.lesson{
background:white;
border-radius:22px;
padding:20px;
box-shadow:0 7px 22px rgba(0,0,0,.08);
}

.lesson.completed{

}

.lesson h2{
margin-top:0;
color:#2563eb;
font-size:23px;
line-height:1.5;
}

.goal{
background:#eef4ff;
padding:13px;
border-radius:13px;
line-height:1.8;
}

.explanation{
line-height:2;
white-space:pre-line;
margin-top:15px;
}

.example{
background:#f8fafc;
padding:15px;
border-radius:15px;
margin-top:12px;
}

.example-en{
direction:ltr;
text-align:left;
font-weight:bold;
font-size:18px;
color:#172033;
line-height:1.6;
}

.example-ar{
margin-top:8px;
line-height:1.7;
}

.sound{
border:0;
background:#2563eb;
color:white;
padding:10px 16px;
border-radius:11px;
cursor:pointer;
margin-top:10px;
font-size:15px;
}

.sound:hover{
background:#1d4ed8;
}

.words{
background:#f5f3ff;
padding:15px;
border-radius:15px;
margin-top:15px;
line-height:2;
}

.practice{
background:#ecfdf5;
padding:15px;
border-radius:15px;
margin-top:15px;
line-height:1.9;
}

.practice-title{
font-weight:bold;
color:#047857;
margin-bottom:5px;
}

.complete-btn{
width:100%;
margin-top:16px;
padding:13px;
border:0;
border-radius:13px;
background:#10b981;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.complete-btn.completed{
background:#64748b;
}

.reset{
display:block;
margin:25px auto;
border:0;
background:#ef4444;
color:white;
padding:11px 20px;
border-radius:12px;
cursor:pointer;
font-size:15px;
}

footer{
text-align:center;
padding:30px;
color:#667085;
}

</style>
</head>

<script>

/* =========================
   الدروس
========================= */

const lessons = [

{
title:"Lesson 1 — Personal Pronouns",
goal:"تعلم الضمائر الشخصية واستخدامها في جمل صحيحة.",
explanation:`الضمير يحل محل الاسم.

I = أنا
You = أنت / أنتم
He = هو
She = هي
It = هو / هي لغير العاقل
We = نحن
They = هم / هن

تأتي الضمائر غالبًا قبل الفعل.`,
examples:[
{english:"I am a student.",arabic:"أنا طالب."},
{english:"She is my sister.",arabic:"هي أختي."},
{english:"They are my friends.",arabic:"هم أصدقائي."}
],
words:["I = أنا","you = أنت / أنتم","he = هو","she = هي","we = نحن","they = هم / هن"],
practice:"اكتب جملة واحدة باستخدام كل ضمير."
},

{
title:"Lesson 2 — Verb To Be",
goal:"إتقان am و is و are.",
explanation:`الفعل To Be من أهم أفعال الإنجليزية.

I → am
He / She / It → is
You / We / They → are

نستخدمه للتعريف والوصف والحالة.`,
examples:[
{english:"I am ready.",arabic:"أنا مستعد."},
{english:"He is happy.",arabic:"هو سعيد."},
{english:"We are students.",arabic:"نحن طلاب."}
],
words:["am = أكون","is = يكون","are = يكونون / تكون","ready = مستعد","happy = سعيد"],
practice:"أكمل: I __ ready. She __ happy. They __ students."
},

{
title:"Lesson 3 — To Be: Negative and Questions",
goal:"تعلم النفي والسؤال باستخدام To Be.",
explanation:`للنفي نضع not بعد am أو is أو are.

I am not tired.

وللسؤال نقدم am أو is أو are على الفاعل.

Are you ready?
Is he a student?`,
examples:[
{english:"I am not tired.",arabic:"أنا لست متعبًا."},
{english:"She is not busy.",arabic:"هي ليست مشغولة."},
{english:"Are you ready?",arabic:"هل أنت مستعد؟"}
],
words:["not = ليس / لا","tired = متعب","busy = مشغول","ready = مستعد","question = سؤال"],
practice:"حوّل جملة مثبتة إلى نفي ثم إلى سؤال."
},

{
title:"Lesson 4 — Object Pronouns",
goal:"التمييز بين ضمائر الفاعل وضمائر المفعول.",
explanation:`ضمائر المفعول تأتي غالبًا بعد الفعل.

me = إياي
you = إياك
him = إياه
her = إياها
us = إيانا
them = إياهم`,
examples:[
{english:"He helps me.",arabic:"هو يساعدني."},
{english:"I know him.",arabic:"أنا أعرفه."},
{english:"They help us.",arabic:"هم يساعدوننا."}
],
words:["me = إياي","him = إياه","her = إياها","us = إيانا","them = إياهم"],
practice:"اكتب خمس جمل باستخدام me و him و her و us و them."
},

{
title:"Lesson 5 — Possessive Adjectives",
goal:"تعلم صفات الملكية.",
explanation:`صفات الملكية:

my = ـي
your = ـك
his = ـه
her = ـها
its = ـه / ـها لغير العاقل
our = ـنا
their = ـهم

تأتي صفة الملكية قبل الاسم.`,
examples:[
{english:"My name is Ahmed.",arabic:"اسمي أحمد."},
{english:"This is her book.",arabic:"هذا كتابها."},
{english:"Our school is big.",arabic:"مدرستنا كبيرة."}
],
words:["my = ـي","your = ـك","his = ـه","her = ـها","our = ـنا","their = ـهم"],
practice:"اكتب جملًا باستخدام my و your و his و her و our و their."
},

{
title:"Lesson 6 — This, That, These, Those",
goal:"التعبير عن الأشياء القريبة والبعيدة.",
explanation:`This = هذا / هذه للمفرد القريب.
That = ذلك / تلك للمفرد البعيد.
These = هذه / هؤلاء للجمع القريب.
Those = تلك / أولئك للجمع البعيد.`,
examples:[
{english:"This is my book.",arabic:"هذا كتابي."},
{english:"That is your phone.",arabic:"ذلك هاتفك."},
{english:"These are my friends.",arabic:"هؤلاء أصدقائي."}
],
words:["this = هذا / هذه","that = ذلك / تلك","these = هؤلاء","those = أولئك","near = قريب","far = بعيد"],
practice:"اكتب أربع جمل باستخدام الكلمات الأربع."
},

{
title:"Lesson 7 — Singular and Plural",
goal:"تعلم المفرد والجمع.",
explanation:`الاسم المفرد يدل على شيء واحد.

book = كتاب

غالبًا نضيف s لصنع الجمع.

book → books

وبعض الكلمات تحتاج es.

box → boxes`,
examples:[
{english:"I have one book.",arabic:"لدي كتاب واحد."},
{english:"I have two books.",arabic:"لدي كتابان."},
{english:"The boxes are big.",arabic:"الصناديق كبيرة."}
],
words:["book = كتاب","books = كتب","box = صندوق","boxes = صناديق","student = طالب"],
practice:"حوّل book و car و student و box و watch إلى الجمع."
},

{
title:"Lesson 8 — A, An and The",
goal:"تعلم أدوات التعريف والتنكير الأساسية.",
explanation:`نستخدم a مع الاسم المفرد الذي يبدأ بصوت ساكن.

a book

نستخدم an قبل صوت العلة.

an apple

نستخدم the عندما يكون الشيء محددًا أو معروفًا.`,
examples:[
{english:"I have a book.",arabic:"لدي كتاب."},
{english:"She has an apple.",arabic:"لديها تفاحة."},
{english:"The book is new.",arabic:"الكتاب جديد."}
],
words:["a = أداة تنكير","an = أداة تنكير","the = الـ","apple = تفاحة","new = جديد"],
practice:"اختر a أو an: __ apple, __ book, __ English lesson."
},

{
title:"Lesson 9 — Have and Has",
goal:"استخدام have و has بشكل صحيح.",
explanation:`نستخدم have مع I و you و we و they.

نستخدم has مع he و she و it.

I have a phone.
She has a phone.`,
examples:[
{english:"I have a book.",arabic:"لدي كتاب."},
{english:"He has a car.",arabic:"لديه سيارة."},
{english:"They have a house.",arabic:"لديهم منزل."}
],
words:["have = لديه / يملك","has = لديه / يملك","phone = هاتف","car = سيارة","house = منزل"],
practice:"أكمل: I __ a book. He __ a car. They __ a house."
},

{
title:"Lesson 10 — There Is and There Are",
goal:"التعبير عن وجود شيء أو عدة أشياء.",
explanation:`There is تستخدم مع المفرد.

There is a book.

There are تستخدم مع الجمع.

There are two books.`,
examples:[
{english:"There is a book on the table.",arabic:"يوجد كتاب على الطاولة."},
{english:"There is a student here.",arabic:"يوجد طالب هنا."},
{english:"There are two chairs.",arabic:"يوجد كرسيان."}
],
words:["there is = يوجد للمفرد","there are = يوجد للجمع","table = طاولة","chair = كرسي","room = غرفة"],
practice:"اكتب جملتين باستخدام There is وجملتين باستخدام There are."
},

{
title:"Lesson 11 — Prepositions of Place",
goal:"تعلم أهم حروف الجر للمكان.",
explanation:`in = في / داخل
on = على
under = تحت
behind = خلف
next to = بجانب
in front of = أمام

تساعدنا هذه الكلمات على وصف مكان الأشخاص والأشياء.`,
examples:[
{english:"The book is on the table.",arabic:"الكتاب على الطاولة."},
{english:"The phone is in the bag.",arabic:"الهاتف داخل الحقيبة."},
{english:"The cat is under the chair.",arabic:"القطة تحت الكرسي."}
],
words:["in = في","on = على","under = تحت","behind = خلف","next to = بجانب","in front of = أمام"],
practice:"صف مكان كتاب وهاتف وحقيبة."
},

{
title:"Lesson 12 — Present Simple",
goal:"تعلم المضارع البسيط للعادات والروتين.",
explanation:`نستخدم Present Simple للعادات والحقائق والروتين.

مع I و you و we و they نستخدم الفعل الأساسي.

I study.

مع he و she و it نضيف غالبًا s أو es.

He studies.`,
examples:[
{english:"I study English every day.",arabic:"أدرس الإنجليزية كل يوم."},
{english:"We work together.",arabic:"نحن نعمل معًا."},
{english:"He studies English.",arabic:"هو يدرس الإنجليزية."}
],
words:["study = يدرس","work = يعمل","speak = يتحدث","every day = كل يوم","usually = عادةً"],
practice:"اكتب خمس جمل عن روتينك."
},

{
title:"Lesson 13 — Third Person Singular",
goal:"إتقان s و es و ies مع he و she و it.",
explanation:`في المضارع البسيط:

work → works
watch → watches
go → goes
study → studies

إذا انتهى الفعل بحرف ساكن ثم y تتحول y إلى ies.`,
examples:[
{english:"He works at home.",arabic:"هو يعمل في المنزل."},
{english:"She watches TV.",arabic:"هي تشاهد التلفاز."},
{english:"He studies English.",arabic:"هو يدرس الإنجليزية."}
],
words:["work → works","watch → watches","go → goes","study → studies","play → plays"],
practice:"حوّل work و watch و go و study و play إلى صيغة he."
},

{
title:"Lesson 14 — Present Simple Negative",
goal:"تعلم don't و doesn't.",
explanation:`نستخدم don't مع I و you و we و they.

نستخدم doesn't مع he و she و it.

بعد doesn't يعود الفعل إلى شكله الأساسي.

He doesn't work.

وليس He doesn't works.`,
examples:[
{english:"I don't speak French.",arabic:"أنا لا أتحدث الفرنسية."},
{english:"We don't study at night.",arabic:"نحن لا ندرس ليلًا."},
{english:"He doesn't work here.",arabic:"هو لا يعمل هنا."}
],
words:["don't = لا","doesn't = لا","speak = يتحدث","work = يعمل","here = هنا"],
practice:"حوّل أربع جمل مثبتة إلى النفي."
},

{
title:"Lesson 15 — Present Simple Questions",
goal:"تكوين الأسئلة باستخدام Do و Does.",
explanation:`Do تستخدم مع I و you و we و they.

Does تستخدم مع he و she و it.

بعد Does نستخدم الفعل الأساسي.`,
examples:[
{english:"Do you speak English?",arabic:"هل تتحدث الإنجليزية؟"},
{english:"Do they study here?",arabic:"هل يدرسون هنا؟"},
{english:"Does he work here?",arabic:"هل يعمل هنا؟"}
],
words:["do = أداة سؤال","does = أداة سؤال","study = يدرس","work = يعمل","speak = يتحدث"],
practice:"حوّل ثلاث جمل إلى أسئلة باستخدام Do و Does."
},

{
title:"Lesson 16 — Question Words",
goal:"تعلم كلمات السؤال الأساسية.",
explanation:`What = ماذا / ما
Where = أين
When = متى
Who = من
Why = لماذا
How = كيف

كل كلمة تستخدم للحصول على نوع مختلف من المعلومات.`,
examples:[
{english:"What is your name?",arabic:"ما اسمك؟"},
{english:"Where do you live?",arabic:"أين تعيش؟"},
{english:"Why are you tired?",arabic:"لماذا أنت متعب؟"}
],
words:["what = ماذا","where = أين","when = متى","who = من","why = لماذا","how = كيف"],
practice:"اكتب سؤالًا بكل كلمة من كلمات السؤال."
},

{
title:"Lesson 17 — Adverbs of Frequency",
goal:"وصف مدى تكرار العادات.",
explanation:`always = دائمًا
usually = عادةً
often = غالبًا
sometimes = أحيانًا
rarely = نادرًا
never = أبدًا

غالبًا تأتي قبل الفعل الأساسي.`,
examples:[
{english:"I always study English.",arabic:"أدرس الإنجليزية دائمًا."},
{english:"I usually wake up early.",arabic:"عادةً أستيقظ مبكرًا."},
{english:"I sometimes read books.",arabic:"أحيانًا أقرأ الكتب."}
],
words:["always = دائمًا","usually = عادةً","often = غالبًا","sometimes = أحيانًا","rarely = نادرًا","never = أبدًا"],
practice:"اكتب خمس عادات باستخدام كلمات التكرار."
},

{
title:"Lesson 18 — Can and Can't",
goal:"التعبير عن القدرة وعدم القدرة.",
explanation:`Can تأتي مع جميع الضمائر.

I can swim.
He can swim.

للنفي نستخدم can't.

I can't swim.

وللسؤال:

Can you swim?`,
examples:[
{english:"I can speak English.",arabic:"أستطيع التحدث بالإنجليزية."},
{english:"She can drive.",arabic:"هي تستطيع القيادة."},
{english:"Can you help me?",arabic:"هل تستطيع مساعدتي؟"}
],
words:["can = يستطيع","can't = لا يستطيع","swim = يسبح","drive = يقود","help = يساعد"],
practice:"اكتب ثلاث قدرات لديك وجملتين عن أشياء لا تستطيع فعلها."
},

{
title:"Lesson 19 — Imperatives",
goal:"تعلم الأوامر والتعليمات والطلبات البسيطة.",
explanation:`في الأمر نستخدم الفعل مباشرة.

Open the door.

للنهي نستخدم Don't.

Don't open the door.

يمكن استخدام please لجعل الطلب أكثر لطفًا.`,
examples:[
{english:"Open the door, please.",arabic:"افتح الباب من فضلك."},
{english:"Listen carefully.",arabic:"استمع بعناية."},
{english:"Don't touch that.",arabic:"لا تلمس ذلك."}
],
words:["open = افتح","close = أغلق","listen = استمع","carefully = بعناية","touch = يلمس"],
practice:"اكتب خمس تعليمات باللغة الإنجليزية."
},

{
title:"Lesson 20 — Present Continuous",
goal:"تعلم المضارع المستمر للأفعال التي تحدث الآن.",
explanation:`التركيب:

am / is / are + verb-ing

I am studying.
She is reading.
They are playing.

نستخدمه غالبًا لما يحدث الآن.`,
examples:[
{english:"I am studying English.",arabic:"أنا أدرس الإنجليزية الآن."},
{english:"She is reading a book.",arabic:"هي تقرأ كتابًا الآن."},
{english:"They are playing football.",arabic:"هم يلعبون كرة القدم الآن."}
],
words:["now = الآن","reading = يقرأ","studying = يدرس","playing = يلعب","learning = يتعلم"],
practice:"اكتب خمس جمل عما يحدث الآن."
},

{
title:"Lesson 21 — Simple vs Continuous",
goal:"التمييز بين العادة والفعل الذي يحدث الآن.",
explanation:`Present Simple للعادات:

I study English every day.

Present Continuous لما يحدث الآن:

I am studying English now.

every day و usually غالبًا مع Present Simple.

now و at the moment غالبًا مع Present Continuous.`,
examples:[
{english:"I study every day.",arabic:"أدرس كل يوم."},
{english:"I am studying now.",arabic:"أنا أدرس الآن."},
{english:"She works every day.",arabic:"هي تعمل كل يوم."}
],
words:["every day = كل يوم","usually = عادةً","now = الآن","at the moment = في هذه اللحظة"],
practice:"اكتب جملة عادة وجملة تحدث الآن باستخدام الفعل نفسه."
},

{
title:"Lesson 22 — Past Simple: Was and Were",
goal:"تعلم الماضي من To Be.",
explanation:`I / he / she / it → was

you / we / they → were

I was tired.
They were happy.

للنفي:

wasn't = was not
weren't = were not`,
examples:[
{english:"I was tired yesterday.",arabic:"كنت متعبًا أمس."},
{english:"She was at school.",arabic:"كانت في المدرسة."},

/* =========================
   نظام حفظ التقدم
========================= */

let completedLessons =
JSON.parse(localStorage.getItem("englishNotebookProgress") || "[]");


/* =========================
   الصوت
========================= */

function speak(text){

if(!("speechSynthesis" in window)){

alert("متصفحك لا يدعم ميزة النطق الصوتي.");

return;
}

window.speechSynthesis.cancel();

const utterance =
new SpeechSynthesisUtterance(text);

utterance.lang="en-US";

utterance.rate=0.78;

utterance.pitch=1;

utterance.volume=1;

window.speechSynthesis.speak(utterance);

}


/* =========================
   إتمام الدرس
========================= */

function completeLesson(index){

if(!completedLessons.includes(index)){

completedLessons.push(index);

localStorage.setItem(
"englishNotebookProgress",
JSON.stringify(completedLessons)
);

}

updateProgress();

displayLessons();

}


/* =========================
   تحديث شريط التقدم
========================= */

function updateProgress(){

const total=lessons.length;

const completed=completedLessons.length;

const percent=
Math.round((completed/total)*100);

document.getElementById("progressInfo").textContent=
completed+" / "+total+" درسًا مكتملًا";

document.getElementById("progressBar").style.width=
percent+"%";

document.getElementById("progressText").textContent=
"تقدمك: "+percent+"%";

}


/* =========================
   عرض الدروس
========================= */

function displayLessons(){

const container=
document.getElementById("lessons");

container.innerHTML="";


lessons.forEach(function(lesson,index){

const card=
document.createElement("article");

card.className="lesson";


if(completedLessons.includes(index)){

card.classList.add("completed");

}


let examplesHTML="";


lesson.examples.forEach(function(example){

examplesHTML+=`

<div class="example">

<div class="example-en">
${example.english}
</div>

<div class="example-ar">
${example.arabic}
</div>

<button
class="sound"
onclick='speak(${JSON.stringify(example.english)})'>
🔊 استمع إلى المثال
</button>

</div>

`;

});


let wordsHTML="";


lesson.words.forEach(function(word){

wordsHTML+=`
<div>• ${word}</div>
`;

});


const isCompleted=
completedLessons.includes(index);


card.innerHTML=`

<h2>
📘 ${lesson.title}
</h2>

<div class="goal">

<strong>🎯 هدف الدرس:</strong><br>

${lesson.goal}

</div>


<div class="explanation">

<strong>📖 الشرح:</strong><br>

${lesson.explanation}

</div>


<div>

<strong>💬 أمثلة:</strong>

${examplesHTML}

</div>


<div class="words">

<strong>🧠 المفردات:</strong>

${wordsHTML}

</div>


<div class="practice">

<div class="practice-title">
✍️ التدريب
</div>

${lesson.practice}

</div>


<button
class="complete-btn ${isCompleted ? "completed" : ""}"
onclick="completeLesson(${index})">

${isCompleted
? "✅ تم إكمال هذا الدرس"
: "☑️ أتممت هذا الدرس"}

</button>

`;


container.appendChild(card);

});

}


/* =========================
   إعادة ضبط التقدم
========================= */

function resetProgress(){

const answer=
confirm("هل تريد حذف تقدمك في جميع الدروس؟");

if(!answer){

return;

}

completedLessons=[];

localStorage.removeItem(
"englishNotebookProgress"
);

updateProgress();

displayLessons();

}


/* =========================
   تشغيل الموقع
========================= */

updateProgress();

displayLessons();

</script>
