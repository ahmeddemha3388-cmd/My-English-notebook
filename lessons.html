const list=document.getElementById("wordsList"); list.innerHTML="";
lesson.words.forEach(function(word){
const div=document.createElement("div"); div.className="word"; div.textContent=word; list.appendChild(div);
});
document.getElementById("practice").innerHTML=lesson.practice;
document.getElementById("previous").disabled=currentLesson===0;
document.getElementById("next").disabled=currentLesson===lessons.length-1;
document.getElementById("status").textContent="";
document.getElementById("listenButton").textContent="🔊 استمع إلى أمثلة الدرس";
}
function nextLesson(){if(currentLesson<lessons.length-1){currentLesson++;showLesson();window.scrollTo(0,0)}}
function previousLesson(){if(currentLesson>0){currentLesson--;showLesson();window.scrollTo(0,0)}}
function listenLesson(){
const text=lessons[currentLesson].examples.map(example=>example.english).join(". ");
const status=document.getElementById("status"),button=document.getElementById("listenButton");
if(!("speechSynthesis" in window)){status.textContent="⚠️ المتصفح لا يدعم الاستماع الصوتي.";return}
window.speechSynthesis.cancel();
const speech=new SpeechSynthesisUtterance(text); speech.lang="en-US"; speech.rate=.8; speech.pitch=1;
speech.onstart=function(){button.textContent="🔊 جاري الاستماع...";status.textContent="استمع إلى أمثلة الدرس..."};
speech.onend=function(){button.textContent="🔊 استمع إلى أمثلة الدرس";status.textContent="✅ انتهى الاستماع."};
speech.onerror=function(){button.textContent="🔊 استمع إلى أمثلة الدرس";status.textContent="⚠️ تعذر تشغيل الصوت."};
window.speechSynthesis.speak(speech);
}
showLesson();
</script>
</body>
</html>
