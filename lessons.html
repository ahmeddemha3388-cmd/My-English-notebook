<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<title>دروس الإنجليزية</title>

<style>
* {
    box-sizing: border-box;
}

body {

}

header {

    text-align: center;
    padding: 30px 18px;
    border-radius: 0 0 28px 28px;
}

header h1 {
    margin: 0;

}

.container {
    max-width: 900px;
    margin: auto;
    padding: 22px 16px;
}

.back {
    display: inline-block;

    color: #2563eb;

}

.lesson {

}

.lesson h2 {

}

.goal {

}

.section {

}

.section h3 {

}

.explanation {

.example {

.english {

}

.arabic {

}

.listen {

    border: none;
    background: #2563eb;
    color: white;
    padding: 12px 24px;
    border-radius: 12px;

}

}

.words {

}

.word {

.practice {

.navigation {

.navigation button {

</head>

<body>

<header>
<h1>📚 دروس الإنجليزية</h1>
<p>My English Lessons</p>
</header>

<div class="container">

<a class="back" href="index.html">
← العودة إلى الرئيسية
</a>

<div class="lesson-number" id="lessonNumber"></div>

<h2 id="title"></h2>

<strong>🎯 هدف الدرس:</strong>

</div>

<h3>📖 شرح الدرس</h3>

</div>

<button class="listen" onclick="listenLesson()">

</button>

<div id="status"></div>

</button>

</div>

</div>

<footer>
My English Notebook © 2026
</footer>

<script>

const lessons = [

{
title: "Lesson 1 — Personal Pronouns",

goal: "تعلم جميع الضمائر الشخصية في الإنجليزية ومعرفة معناها واستخدامها الأساسي.",

explanation: `

You = أنت / أنتم<br>
He = هو<br>
She = هي<br>
It = هو / هي لغير العاقل<br>
We = نحن<br>

examples: [

{
english: "I am a student.",
arabic: "أنا طالب."
},

{
english: "You are my friend.",

},

{
english: "He is Ahmed.",
arabic: "هو أحمد."
},

{
english: "She is a student.",
arabic: "هي طالبة."

{

arabic: "نحن طلاب."
},

{

words: [

"I = أنا",

"He = هو",

let currentLesson = 0;


function showLesson() {

const lesson = lessons[currentLesson];

document.getElementById("lessonNumber").textContent =
"الدرس " + (currentLesson + 1) + " من " + lessons.length;

document.getElementById("title").textContent =
lesson.title;

document.getElementById("goal").textContent =
lesson.goal;

document.getElementById("explanation").innerHTML =
lesson.explanation;


const examples =
document.getElementById("examples");

examples.innerHTML = "";


lesson.examples.forEach(function(example) {

const div = document.createElement("div");

div.className = "example";

div.innerHTML = `
<div class="english">${example.english}</div>
<div class="arabic">${example.arabic}</div>
`;

examples.appendChild(div);

});


const list =
document.getElementById("wordsList");

list.innerHTML = "";


lesson.words.forEach(function(word) {

const div = document.createElement("div");

div.className = "word";

div.textContent = word;

list.appendChild(div);

});


document.getElementById("practice").innerHTML =
lesson.practice;


document.getElementById("previous").disabled =
currentLesson === 0;

document.getElementById("next").disabled =
currentLesson === lessons.length - 1;

document.getElementById("status").textContent = "";

}


function nextLesson() {

if (currentLesson < lessons.length - 1) {

currentLesson++;

showLesson();

window.scrollTo(0, 0);

}

}


function previousLesson() {

if (currentLesson > 0) {

currentLesson--;

showLesson();

window.scrollTo(0, 0);

}

}


function listenLesson() {

const lesson = lessons[currentLesson];

const text = lesson.examples
.map(example => example.english)
.join(". ");


const status =
document.getElementById("status");


if (!("speechSynthesis" in window)) {

status.textContent =
"⚠️ المتصفح لا يدعم الاستماع الصوتي.";

return;

}


window.speechSynthesis.cancel();


const speech =
new SpeechSynthesisUtterance(text);

speech.lang = "en-US";

speech.rate = 0.8;

speech.pitch = 1;


speech.onstart = function() {

status.textContent =
"🔊 جاري الاستماع إلى أمثلة الدرس...";

};


speech.onend = function() {

status.textContent =
"✅ انتهى الاستماع.";

};


speech.onerror = function() {

status.textContent =
"⚠️ تعذر تشغيل الصوت.";

};


window.speechSynthesis.speak(speech);

}


showLesson();

</script>
