function showLevel(level,button){

document.querySelectorAll(".level").forEach(function(b){
b.classList.remove("active");
});

button.classList.add("active");

const container=document.getElementById("vocabulary");
container.innerHTML="";

vocabulary[level].forEach(function(item){

const card=document.createElement("div");
card.className="word-card";

card.innerHTML=`
<div class="word">${item[0]}</div>
<div class="meaning"><strong>المعنى:</strong> ${item[1]}</div>
<div class="example">
<div class="example-en">${item[2]}</div>
<div>${item[3]}</div>
</div>
<button class="sound" onclick="speak(${JSON.stringify(item[2])})">🔊 استمع</button>
`;

container.appendChild(card);

});

}

function speak(text){

if(!("speechSynthesis" in window)){
alert("المتصفح لا يدعم النطق الصوتي.");
return;
}

window.speechSynthesis.cancel();

const speech=new SpeechSynthesisUtterance(text);
speech.lang="en-US";
speech.rate=.8;

window.speechSynthesis.speak(speech);

}

showLevel("beginner",document.querySelector(".level"));
