<script>

const grammar = [

{
title:"نطق TH — /θ/ و /ð/",
level:"مبتدئ",
explanation:"حرفا TH لهما صوتان أساسيان. الصوت /θ/ مثل think، والصوت /ð/ مثل this. الفرق بينهما مهم جدًا لتحسين النطق.",
rule:"think → /θ/  |  this → /ð/  |  يجب وضع اللسان بين الأسنان بشكل خفيف.",
examples:[
["Think about it.","فكر في الأمر."],
["This is my book.","هذا كتابي."]
]
},

{
title:"الفرق بين P و B",
level:"مبتدئ",
explanation:"الصوت P أقوى وفيه هواء أكثر، بينما B صوت مجهور. الخلط بينهما قد يغير معنى الكلمة.",
rule:"P: pen / B: ben — ركز على كمية الهواء عند نطق P.",
examples:[
["Please open the paper.","من فضلك افتح الورقة."],
["I bought a blue bag.","اشتريت حقيبة زرقاء."]
]
},

{
title:"الفرق بين F و V",
level:"مبتدئ",
explanation:"في F تخرج النفخة من بين الشفة والأسنان دون اهتزاز واضح، أما V ففيه اهتزاز للصوت.",
rule:"F = fan | V = van",
examples:[
["My family is here.","عائلتي هنا."],
["The van is outside.","الشاحنة الصغيرة في الخارج."]
]
},

{
title:"نطق R الإنجليزية",
level:"مبتدئ",
explanation:"صوت R الإنجليزية يختلف عن الراء العربية. لا نكرر اهتزاز اللسان كما في بعض طرق نطق الراء العربية.",
rule:"ضع اللسان دون ضرب سقف الفم وحافظ على الصوت متصلًا.",
examples:[
["I read every day.","أقرأ كل يوم."],
["The red car is fast.","السيارة الحمراء سريعة."]
]
},

{
title:"نطق S و Z",
level:"مبتدئ",
explanation:"S صوت مهم في الإنجليزية، بينما Z يشبه S مع اهتزاز الأحبال الصوتية.",
rule:"S: see | Z: zoo",
examples:[
["I see the school.","أرى المدرسة."],
["The zoo is big.","حديقة الحيوانات كبيرة."]
]
},

{
title:"نطق ED في نهاية الأفعال",
level:"مبتدئ",
explanation:"نهاية ED لها ثلاثة أصوات شائعة: /t/ و /d/ و /ɪd/. لا تُنطق دائمًا بالطريقة نفسها.",
rule:"watched → /t/ | played → /d/ | wanted → /ɪd/",
examples:[
["I watched a movie.","شاهدت فيلمًا."],
["She played football.","لعبت كرة القدم."],
["He wanted some water.","أراد بعض الماء."]
]
},

{
title:"نطق S و ES في الجمع",
level:"مبتدئ",
explanation:"نهاية الجمع s قد تكون /s/ أو /z/، وقد تصبح /ɪz/ في بعض الكلمات.",
rule:"books → /s/ | bags → /z/ | buses → /ɪz/",
examples:[
["I have two books.","لدي كتابان."],
["She has three bags.","لديها ثلاث حقائب."],
["The buses are late.","الحافلات متأخرة."]
]
},

{
title:"A و AN",
level:"مبتدئ",
explanation:"نستخدم a قبل صوت ساكن، وan قبل صوت حرف علة. المهم هو الصوت وليس الحرف المكتوب فقط.",
rule:"a book | a university | an apple | an hour",
examples:[
["I have a book.","لدي كتاب."],
["She ate an apple.","أكلت تفاحة."]
]
},

{
title:"استخدام THE",
level:"مبتدئ",
explanation:"نستخدم the عندما يكون الاسم محددًا أو معروفًا للمتحدث والمستمع.",
rule:"a book = كتاب غير محدد | the book = الكتاب المحدد",
examples:[
["I bought a book.","اشتريت كتابًا."],
["The book is interesting.","الكتاب ممتع."]
]
},

{
title:"المفرد والجمع",
level:"مبتدئ",
explanation:"الأسماء الإنجليزية قد تكون مفردة أو جمعًا. غالبًا نضيف s، لكن بعض الكلمات لها قواعد أخرى.",
rule:"book → books | box → boxes | city → cities",
examples:[
["This book is new.","هذا الكتاب جديد."],
["These boxes are heavy.","هذه الصناديق ثقيلة."]
]
},

{
title:"الأسماء المعدودة وغير المعدودة",
level:"مبتدئ",
explanation:"الاسم المعدود يمكن عده مثل books، أما غير المعدود فلا نستخدمه عادة مع رقم مباشر مثل water.",
rule:"three books ✔ | three waters ✘ | some water ✔",
examples:[
["I have three books.","لدي ثلاثة كتب."],
["I need some water.","أحتاج إلى بعض الماء."]
]
},

{
title:"SOME و ANY",
level:"مبتدئ",
explanation:"some تستخدم كثيرًا في الجمل المثبتة، وany تستخدم كثيرًا في النفي والأسئلة.",
rule:"some books | any books",
examples:[
["I have some money.","لدي بعض المال."],
["Do you have any money?","هل لديك أي مال؟"],
["I don't have any money.","ليس لدي أي مال."]
]
},

{
title:"MUCH و MANY",
level:"مبتدئ",
explanation:"many تستخدم مع الأسماء المعدودة، وmuch تستخدم غالبًا مع الأسماء غير المعدودة.",
rule:"many books | much water",
examples:[
["How many books do you have?","كم كتابًا لديك؟"],
["How much water do you drink?","كم من الماء تشرب؟"]
]
},

{
title:"FEW و LITTLE",
level:"مبتدئ",
explanation:"few تستخدم مع الأسماء المعدودة، وlittle مع الأسماء غير المعدودة.",
rule:"a few students | a little water",
examples:[
["I have a few questions.","لدي بضعة أسئلة."],
["I need a little time.","أحتاج إلى قليل من الوقت."]
]
},

{
title:"IN و ON و AT للمكان",
level:"مبتدئ",
explanation:"تستخدم هذه الكلمات للتعبير عن المكان بطريقة مختلفة حسب السياق.",
rule:"in the room | on the table | at the door",
examples:[
["She is in the room.","هي في الغرفة."],
["The phone is on the table.","الهاتف على الطاولة."],
["He is at the door.","هو عند الباب."]
]
},

{
title:"IN و ON و AT للوقت",
level:"مبتدئ",
explanation:"نستخدم in مع فترات طويلة، on مع الأيام والتواريخ، وat مع أوقات محددة.",
rule:"in 2026 | on Monday | at 8 o'clock",
examples:[
["I was born in 2005.","وُلدت في عام 2005."],
["We study on Monday.","ندرس يوم الاثنين."],
["I wake up at eight.","أستيقظ في الثامنة."]
]
},

{
title:"ترتيب الكلمات في الجملة",
level:"مبتدئ",
explanation:"الترتيب الأساسي في الجملة الإنجليزية هو الفاعل ثم الفعل ثم المفعول به.",
rule:"Subject + Verb + Object",
examples:[
["I read books.","أنا أقرأ الكتب."],
["She speaks English.","هي تتحدث الإنجليزية."]
]
},

{
title:"الصفة قبل الاسم",
level:"مبتدئ",
explanation:"في الإنجليزية تأتي الصفة عادة قبل الاسم الذي تصفه.",
rule:"a beautiful house وليس a house beautiful",
examples:[
["She has a beautiful house.","لديها منزل جميل."],
["He bought a new phone.","اشترى هاتفًا جديدًا."]
]
},

{
title:"الصفات لا تأخذ جمعًا",
level:"مبتدئ",
explanation:"الصفة الإنجليزية لا تتغير عادة عندما يكون الاسم جمعًا.",
rule:"a red car | two red cars",
examples:[
["It is a small room.","إنها غرفة صغيرة."],
["They are small rooms.","إنها غرف صغيرة."]
]
},

{
title:"المقارنة باستخدام ER و MORE",
level:"مبتدئ",
explanation:"نستخدم -er مع كثير من الصفات القصيرة، وmore مع كثير من الصفات الطويلة للمقارنة بين شيئين.",
rule:"small → smaller | beautiful → more beautiful",
examples:[
["Ali is taller than Omar.","علي أطول من عمر."],
["This book is more interesting.","هذا الكتاب أكثر إثارة للاهتمام."]
]
},

{
title:"صيغة التفضيل EST و MOST",
level:"مبتدئ",
explanation:"نستخدم -est أو most عندما نقارن شيئًا بمجموعة كاملة.",
rule:"small → smallest | beautiful → most beautiful",
examples:[
["He is the tallest student.","هو أطول طالب."],
["This is the most useful book.","هذا أكثر كتاب مفيد."]
]
},

{
title:"DO و DOES في الأسئلة",
level:"متوسط",
explanation:"نستخدم do مع I وyou وwe وthey، وdoes مع he وshe وit.",
rule:"Do you work? | Does he work?",
examples:[
["Do you speak English?","هل تتحدث الإنجليزية؟"],
["Does she work here?","هل تعمل هنا؟"]
]
},

{
title:"DID في الماضي",
level:"متوسط",
explanation:"نستخدم did لتكوين الأسئلة في الماضي، وبعده يعود الفعل إلى صورته الأساسية.",
rule:"Did + subject + base verb",
examples:[
["Did you see him?","هل رأيته؟"],
["Did she go to school?","هل ذهبت إلى المدرسة؟"]
]
},

{
title:"النفي باستخدام DON'T و DOESN'T",
level:"متوسط",
explanation:"بعد doesn't نستخدم الفعل الأساسي دون s.",
rule:"He works → He doesn't work.",
examples:[
["I don't understand.","أنا لا أفهم."],
["He doesn't speak French.","هو لا يتحدث الفرنسية."]
]
},

{
title:"النفي باستخدام DIDN'T",
level:"متوسط",
explanation:"في النفي بالماضي نستخدم didn't وبعدها الفعل الأساسي.",
rule:"didn't + base verb",
examples:[
["I didn't go yesterday.","لم أذهب أمس."],
["She didn't understand.","هي لم تفهم."]
]
},

{
title:"MUST و HAVE TO",
level:"متوسط",
explanation:"كلاهما يستخدم للتعبير عن الضرورة، لكن have to ترتبط كثيرًا بضرورة أو قاعدة مفروضة من الخارج.",
rule:"must = يجب | have to = يتعين عليه",
examples:[
["You must be careful.","يجب أن تكون حذرًا."],
["I have to study today.","يجب علي أن أدرس اليوم."]
]
},

{
title:"SHOULD للنصيحة",
level:"متوسط",
explanation:"نستخدم should لإعطاء النصيحة أو التوصية.",
rule:"should + base verb",
examples:[
["You should study more.","ينبغي أن تدرس أكثر."],
["You should get some rest.","ينبغي أن تحصل على بعض الراحة."]
]
},

{
title:"MAY و MIGHT",
level:"متوسط",
explanation:"نستخدم may وmight للتعبير عن الاحتمال. غالبًا يكون might أكثر تحفظًا في التعبير عن الاحتمال.",
rule:"may/might + base verb",
examples:[
["It may rain today.","قد تمطر اليوم."],
["He might come later.","قد يأتي لاحقًا."]
]
},

{
title:"COULD للقدرة والاحتمال والطلب",
level:"متوسط",
explanation:"يمكن أن تستخدم could للقدرة في الماضي، أو لطلب مهذب، أو لاحتمال.",
rule:"could + base verb",
examples:[
["I could swim when I was young.","كنت أستطيع السباحة عندما كنت صغيرًا."],
["Could you help me?","هل يمكنك مساعدتي؟"]
]
},

{
title:"GERUND — الفعل مع ING",
level:"متوسط",
explanation:"يمكن أن يعمل الفعل المنتهي بـ ing كاسم في الجملة، ويأتي أيضًا بعد أفعال معينة.",
rule:"Reading is useful. | I enjoy reading.",
examples:[
["Reading is useful.","القراءة مفيدة."],
["I enjoy learning English.","أستمتع بتعلم الإنجليزية."]
]
},

{
title:"INFINITIVE — TO + VERB",
level:"متوسط",
explanation:"يأتي to قبل الفعل الأساسي في تراكيب كثيرة للتعبير عن الغرض أو بعد أفعال معينة.",
rule:"to + base verb",
examples:[
["I want to learn English.","أريد أن أتعلم الإنجليزية."],
["She decided to study.","قررت أن تدرس."]
]
},

{
title:"SAY و TELL",
level:"متوسط",
explanation:"say تركز على الكلام نفسه، بينما tell تستخدم كثيرًا مع الشخص الذي نوجه إليه الكلام.",
rule:"say something | tell someone something",
examples:[
["He said hello.","قال مرحبًا."],
["She told me the truth.","أخبرتني الحقيقة."]
]
},

{
title:"MAKE و DO",
level:"متوسط",
explanation:"make تستخدم كثيرًا عند إنشاء أو إنتاج شيء، بينما do تستخدم مع الأعمال والمهام والأنشطة.",
rule:"make a cake | do homework",
examples:[
["I made a cake.","صنعت كعكة."],
["I do my homework.","أقوم بواجبي المنزلي."]
]
},

{
title:"USED TO",
level:"متوسط",
explanation:"نستخدم used to للحديث عن عادة أو حالة كانت موجودة في الماضي ولم تعد موجودة الآن.",
rule:"used to + base verb",
examples:[
["I used to play football.","كنت ألعب كرة القدم."],
["She used to live here.","كانت تعيش هنا."]
]
},

{
title:"FOR و SINCE",
level:"متوسط",
explanation:"for تستخدم مع مدة زمنية، وsince تستخدم مع نقطة بداية زمنية.",
rule:"for two years | since 2024",
examples:[
["I have lived here for two years.","عشت هنا لمدة سنتين."],
["I have studied English since 2024.","أدرس الإنجليزية منذ عام 2024."]
]
},

{
title:"ALREADY و YET و STILL",
level:"متوسط",
explanation:"already تعني أن شيئًا حدث قبل المتوقع، yet تستخدم كثيرًا في الأسئلة والنفي، وstill تعني أن الحالة مستمرة.",
rule:"already = بالفعل | yet = بعد/حتى الآن | still = ما زال",
examples:[
["I have already eaten.","لقد أكلت بالفعل."],
["Have you finished yet?","هل انتهيت بعد؟"],
["I still need help.","ما زلت أحتاج إلى المساعدة."]
]
},

{
title:"TOO و ENOUGH",
level:"متوسط",
explanation:"too تعني أكثر من اللازم، وenough تعني بالقدر الكافي.",
rule:"too + adjective | adjective + enough",
examples:[
["The bag is too heavy.","الحقيبة ثقيلة جدًا."],
["The room is big enough.","الغرفة كبيرة بما يكفي."]
]
},

{
title:"SO و SUCH",
level:"متوسط",
explanation:"so تأتي غالبًا قبل الصفة أو الحال، بينما such تأتي قبل اسم أو مجموعة اسمية.",
rule:"so + adjective | such + noun",
examples:[
["It is so beautiful.","إنه جميل جدًا."],
["It is such a beautiful day.","إنه يوم جميل جدًا."]
]
},

{
title:"WHO و WHICH و THAT",
level:"متوسط",
explanation:"تستخدم هذه الكلمات لربط جملة باسم سبق ذكره. who للأشخاص وwhich للأشياء، وthat يمكن أن تستخدم في حالات كثيرة.",
rule:"person → who | thing → which/that",
examples:[
["The man who called me is my teacher.","الرجل الذي اتصل بي هو معلمي."],
["The book that I bought is useful.","الكتاب الذي اشتريته مفيد."]
]
},

{
title:"الشرط الأول — First Conditional",
level:"متوسط",
explanation:"نستخدم الشرط الأول لنتيجة مستقبلية محتملة إذا تحقق الشرط.",
rule:"If + Present Simple, will + base verb",
examples:[
["If it rains, I will stay home.","إذا أمطرت، سأبقى في المنزل."],
["If I study, I will pass.","إذا درست، سأنجح."]
]
},

{
title:"الشرط الثاني — Second Conditional",
level:"متقدم",
explanation:"نستخدم الشرط الثاني للمواقف الافتراضية أو غير المحتملة في الحاضر أو المستقبل.",
rule:"If + Past Simple, would + base verb",
examples:[
["If I had more time, I would travel.","لو كان لدي وقت أكثر، لسافرت."],
["If I were you, I would study.","لو كنت مكانك، لدرست."]
]
},

{
title:"الشرط الثالث — Third Conditional",
level:"متقدم",
explanation:"نستخدم الشرط الثالث للحديث عن موقف ماضٍ لم يحدث ونتيجة افتراضية له.",
rule:"If + Past Perfect, would have + past participle",
examples:[
["If I had studied, I would have passed.","لو كنت درست، لكنت نجحت."],
["If she had called, I would have answered.","لو كانت قد اتصلت، لكنت أجبت."]
]
},

{
title:"المبني للمجهول — Passive Voice",
level:"متقدم",
explanation:"نستخدم المبني للمجهول عندما يكون الفعل أو نتيجته أهم من الشخص الذي قام بالفعل.",

const list = document.getElementById("grammarList");

grammar.forEach(function(item,index){

    const card = document.createElement("div");
    card.className = "rule";

    let examplesHTML = "";

    item.examples.forEach(function(example){

        const english = example[0];
        const arabic = example[1];

        examplesHTML += `
        <div class="example">

            <div class="english">${english}</div>

            <div class="arabic">${arabic}</div>

            <button class="listen" onclick="speak(${JSON.stringify(english)})">
                🔊 استماع
            </button>

        </div>
        `;
    });

    card.innerHTML = `
        <div class="number">القاعدة ${index + 1}</div>

        <div class="level">${item.level}</div>

        <h2 class="title">${item.title}</h2>

        <div class="explanation">
            ${item.explanation}
        </div>

        <div class="rulebox">
            <strong>📌 القاعدة:</strong><br>
            ${item.rule}
        </div>

        <strong>📝 أمثلة:</strong>

        ${examplesHTML}
    `;

    list.appendChild(card);

});

function speak(text){

    if(!("speechSynthesis" in window)){
        alert("المتصفح لا يدعم النطق الصوتي.");
        return;
    }

    window.speechSynthesis.cancel();

    const voice = new SpeechSynthesisUtterance(text);

    voice.lang = "en-US";
    voice.rate = 0.8;
    voice.pitch = 1;

    window.speechSynthesis.speak(voice);
}
