<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قواعد اللغة الإنجليزية</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef4ff, #f8fbff);
    color: #172033;
}

header {
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: white;
    text-align: center;
    padding: 32px 18px;
    border-radius: 0 0 30px 30px;
}

header h1 {
    margin: 0;
    font-size: 31px;
}

header p {
    margin: 12px 0 0;
    font-size: 17px;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 22px 16px;
}

.back {
    display: inline-block;
    background: white;
    color: #2563eb;
    text-decoration: none;
    padding: 11px 18px;
    border-radius: 13px;
    margin-bottom: 20px;
    font-weight: bold;
}

.intro {
    background: white;
    padding: 22px;
    border-radius: 20px;
    margin-bottom: 22px;
    line-height: 1.9;
    box-shadow: 0 8px 25px rgba(30,60,100,0.10);
}

.rule {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 17px;
    box-shadow: 0 7px 22px rgba(30,60,100,0.08);
}

.number {
    color: #667085;
    font-size: 14px;
    margin-bottom: 7px;
}

.rule h2 {
    margin: 5px 0 13px;
    font-size: 22px;
    color: #2563eb;
}

.explanation {
    line-height: 1.9;
    font-size: 16px;
    white-space: pre-line;
}

.example {
    direction: ltr;
    text-align: left;
    background: #f5f8ff;
    border-radius: 14px;
    padding: 13px;
    margin-top: 13px;
    line-height: 1.7;
}

.example strong {
    color: #2563eb;
}

.translation {
    direction: rtl;
    text-align: right;
    margin-top: 5px;
    color: #475467;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.listen,
.translate {
    border: none;
    padding: 10px 17px;
    border-radius: 11px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.listen {
    background: #2563eb;
    color: white;
}

.translate {
    background: #eef2ff;
    color: #3730a3;
}

.listen:active,
.translate:active {
    transform: scale(0.97);
}

footer {
    text-align: center;
    padding: 30px;
    color: #667085;
}
</style>
</head>

<body>

<header>
    <h1>✍️ قواعد اللغة الإنجليزية</h1>
    <p>English Grammar — من المبتدئ إلى المتقدم</p>
</header>

<div class="container">

<a class="back" href="index.html">← العودة إلى الرئيسية</a>

<div class="intro">
    <strong>📚 مسار القواعد</strong>
    <br>
    50 قاعدة مرتبة تدريجيًا من الأساسيات إلى القواعد المتقدمة،
    مع شرح عربي، أمثلة إنجليزية، ترجمة، وزر استماع للنطق.
</div>

<div id="rules"></div>

</div>

<footer>
My English Notebook © 2026
</footer>

<script>

const rules = [

{
title:"Subject and Verb",
explanation:"في الجملة الإنجليزية نحتاج غالبًا إلى فاعل وفعل. ترتيب الجملة الأساسي هو: Subject + Verb.",
example:"I study English.",
translation:"أنا أدرس الإنجليزية."
},

{
title:"Object in the Sentence",
explanation:"المفعول به يأتي غالبًا بعد الفعل ليبين الشيء أو الشخص الذي يقع عليه الفعل.",
example:"I read a book.",
translation:"أنا أقرأ كتابًا."
},

{
title:"Word Order",
explanation:"الترتيب الأساسي للجملة الإنجليزية هو: Subject + Verb + Object.",
example:"She learns English.",
translation:"هي تتعلم الإنجليزية."
},

{
title:"Capital Letters",
explanation:"نستخدم الحرف الكبير في بداية الجملة، ومع I، وأسماء الأشخاص والأماكن وغيرها من الأسماء الخاصة.",
example:"Ahmed lives in Nouakchott.",
translation:"أحمد يعيش في نواكشوط."
},

{
title:"Full Stop and Question Mark",
explanation:"نستخدم النقطة في نهاية الجملة الخبرية، وعلامة الاستفهام في نهاية السؤال.",
example:"You are ready. Are you ready?",
translation:"أنت مستعد. هل أنت مستعد؟"
},

{
title:"Countable Nouns",
explanation:"الأسماء المعدودة يمكن أن يكون لها مفرد وجمع، مثل book و books.",
example:"I have two books.",
translation:"لدي كتابان."
},

{
title:"Uncountable Nouns",
explanation:"بعض الأسماء لا نستخدمها عادةً بصيغة الجمع عندما نتحدث عن المادة أو الكمية بشكل عام، مثل water و information.",
example:"I need some water.",
translation:"أحتاج إلى بعض الماء."
},

{
title:"Plural with S",
explanation:"غالبًا نضيف s إلى الاسم لصنع الجمع.",
example:"One car. Two cars.",
translation:"سيارة واحدة. سيارتان."
},

{
title:"Plural with ES",
explanation:"بعض الأسماء التي تنتهي بأصوات معينة مثل s أو sh أو ch تحتاج غالبًا إلى es في الجمع.",
example:"One watch. Two watches.",
translation:"ساعة واحدة. ساعتان."
},

{
title:"Plural with IES",
explanation:"إذا انتهى الاسم بحرف ساكن ثم y، تتحول y غالبًا إلى ies عند الجمع.",
example:"One city. Two cities.",
translation:"مدينة واحدة. مدينتان."
},

{
title:"A",
explanation:"نستخدم a مع الاسم المفرد المعدود عندما يكون غير محدد ويبدأ بصوت ساكن.",
example:"I have a book.",
translation:"لدي كتاب."
},

{
title:"AN",
explanation:"نستخدم an مع الاسم المفرد المعدود عندما يبدأ بصوت علّة.",
example:"She has an apple.",
translation:"لديها تفاحة."
},

{
title:"THE",
explanation:"نستخدم the عندما يكون الاسم محددًا أو معروفًا للمتحدث والمستمع.",
example:"The book is on the table.",
translation:"الكتاب على الطاولة."
},

{
title:"Possessive 's",
explanation:"نستخدم 's للتعبير عن الملكية، خاصةً مع الأشخاص.",
example:"This is Ahmed's book.",
translation:"هذا كتاب أحمد."
},

{
title:"Possessive Adjectives",
explanation:"صفات الملكية هي my, your, his, her, its, our, their، وتأتي قبل الاسم.",
example:"This is my phone.",
translation:"هذا هاتفي."
},

{
title:"To Be: AM",
explanation:"نستخدم am مع الضمير I.",
example:"I am a student.",
translation:"أنا طالب."
},

{
title:"To Be: IS",
explanation:"نستخدم is مع he و she و it ومع الاسم المفرد.",
example:"She is happy.",
translation:"هي سعيدة."
},

{
title:"To Be: ARE",
explanation:"نستخدم are مع you و we و they ومع الجمع.",
example:"They are ready.",
translation:"هم مستعدون."
},

{
title:"Present Simple",
explanation:"نستخدم المضارع البسيط للعادات والروتين والحقائق العامة.",
example:"I study every day.",
translation:"أدرس كل يوم."
},

{
title:"Third Person S",
explanation:"مع he و she و it نضيف s أو صيغة مناسبة للفعل في المضارع البسيط.",
example:"He works every day.",
translation:"هو يعمل كل يوم."
},

{
title:"Present Simple: ES",
explanation:"بعض الأفعال تأخذ es مع he و she و it، مثل go → goes و watch → watches.",
example:"She watches TV.",
translation:"هي تشاهد التلفاز."
},

{
title:"Present Simple: IES",
explanation:"إذا انتهى الفعل بحرف ساكن ثم y، تتحول y إلى ies مع he و she و it.",
example:"He studies English.",
translation:"هو يدرس الإنجليزية."
},

{
title:"DO in Questions",
explanation:"نستخدم do لتكوين أسئلة المضارع البسيط مع I و you و we و they.",
example:"Do you speak English?",
translation:"هل تتحدث الإنجليزية؟"
},

{
title:"DOES in Questions",
explanation:"نستخدم does مع he و she و it. وبعد does يعود الفعل إلى شكله الأساسي.",
example:"Does he work here?",
translation:"هل يعمل هنا؟"
},

{
title:"DON'T",
explanation:"نستخدم don't لنفي المضارع البسيط مع I و you و we و they.",
example:"I don't understand.",
translation:"أنا لا أفهم."
},

{
title:"DOESN'T",
explanation:"نستخدم doesn't مع he و she و it، ويأتي بعدها الفعل الأساسي دون s.",
example:"She doesn't work here.",
translation:"هي لا تعمل هنا."
},

{
title:"Present Continuous",
explanation:"المضارع المستمر يتكون من am أو is أو are + verb-ing، ويستخدم غالبًا لما يحدث الآن.",
example:"I am studying now.",
translation:"أنا أدرس الآن."
},

{
title:"ING Form",
explanation:"عند تكوين المضارع المستمر نضيف ing إلى الفعل، مع وجود بعض قواعد الإملاء الخاصة.",
example:"She is reading a book.",
translation:"هي تقرأ كتابًا."
},

{
title:"Present Simple vs Continuous",
explanation:"المضارع البسيط للعادات، والمضارع المستمر لما يحدث الآن أو حول وقت الكلام.",
example:"I study every day. I am studying now.",
translation:"أدرس كل يوم. أنا أدرس الآن."
},

{
title:"Past Simple with WAS",
explanation:"نستخدم was مع I و he و she و it في الماضي.",
example:"I was tired yesterday.",
translation:"كنت متعبًا أمس."
},

{
title:"Past Simple with WERE",
explanation:"نستخدم were مع you و we و they في الماضي.",
example:"They were at home.",
translation:"كانوا في المنزل."
},

{
title:"Regular Past Verbs",
explanation:"الأفعال المنتظمة تأخذ ed غالبًا في الماضي البسيط.",
example:"I worked yesterday.",
translation:"عملت أمس."
},

{
title:"Irregular Past Verbs",
explanation:"بعض الأفعال لها شكل خاص في الماضي ولا تتبع قاعدة ed، مثل go → went.",
example:"She went to school.",
translation:"ذهبت إلى المدرسة."
},

{
title:"Past Simple Questions",
explanation:"نستخدم did لتكوين أسئلة الماضي البسيط، وبعد did يعود الفعل إلى شكله الأساسي.",
example:"Did you study yesterday?",
translation:"هل درست أمس؟"
},

{
title:"Past Simple Negative",
explanation:"نستخدم did not أو didn't للنفي في الماضي، وبعدها يأتي الفعل الأساسي.",
example:"I didn't go to school.",
translation:"لم أذهب إلى المدرسة."
},

{
title:"Going To Future",
explanation:"نستخدم be going to للتعبير عن خطة أو نية مستقبلية.",
example:"I am going to study tonight.",
translation:"سأدرس الليلة."
},

{
title:"WILL Future",
explanation:"نستخدم will للتحدث عن المستقبل، مثل التوقعات والقرارات التي نتخذها أثناء الكلام.",
example:"I will help you.",
translation:"سأساعدك."
},

{
title:"CAN",
explanation:"نستخدم can للتعبير عن القدرة أو الإمكانية أو طلب الإذن في بعض السياقات.",
example:"I can speak English.",
translation:"أستطيع التحدث بالإنجليزية."
},

{
title:"CAN'T",
explanation:"نستخدم can't للتعبير عن عدم القدرة أو عدم الإمكانية.",
example:"I can't swim.",
translation:"لا أستطيع السباحة."
},

{
title:"SHOULD",
explanation:"نستخدم should لإعطاء النصيحة أو التعبير عما هو مناسب.",
example:"You should study more.",
translation:"ينبغي أن تدرس أكثر."
},

{
title:"MUST",
explanation:"نستخدم must للتعبير عن ضرورة قوية أو التزام.",
example:"You must be careful.",
translation:"يجب أن تكون حذرًا."
},

{
title:"MUST NOT",
explanation:"must not أو mustn't تعني أن الشيء ممنوع أو غير مسموح به.",
example:"You mustn't touch this.",
translation:"يجب ألا تلمس هذا."
},

{
title:"Comparatives",
explanation:"نستخدم صيغة المقارنة لمقارنة شخصين أو شيئين. غالبًا نستخدم -er مع الصفات القصيرة أو more مع بعض الصفات الطويلة.",
example:"This book is better than that one.",
translation:"هذا الكتاب أفضل من ذلك."
},

{
title:"Superlatives",
explanation:"نستخدم صيغة التفضيل للحديث عن أعلى درجة بين مجموعة.",
example:"He is the tallest student.",
translation:"هو أطول طالب."
},

{
title:"Adverbs of Frequency",
explanation:"كلمات مثل always و usually و often و sometimes و never توضح مدى تكرار الفعل.",
example:"I usually study at night.",
translation:"عادةً أدرس في الليل."
},

{
title:"Prepositions of Time",
explanation:"نستخدم at مع أوقات محددة، on مع الأيام والتواريخ، و in مع الأشهر والسنوات والفترات.",
example:"I study at night. I study on Monday. I study in July.",
translation:"أدرس في الليل. أدرس يوم الاثنين. أدرس في يوليو."
},

{
title:"Prepositions of Place",
explanation:"من حروف الجر المهمة للمكان: in و on و under و behind و next to.",
example:"The phone is on the table.",
translation:"الهاتف على الطاولة."
},

{
title:"First Conditional",
explanation:"نستخدم الشرط الأول للحديث عن احتمال حقيقي في المستقبل. التركيب الأساسي: If + present simple, will + verb.",
example:"If I study, I will pass.",
translation:"إذا درست، فسأنجح."
},

{
title:"Second Conditional",
explanation:"نستخدم الشرط الثاني للحديث عن مواقف افتراضية أو غير محتملة في الحاضر أو المستقبل.",
example:"If I had more time, I would travel.",
translation:"لو كان لدي وقت أكثر، لسافرت."
},

{
title:"Present Perfect",
explanation:"يتكون المضارع التام من have أو has + التصريف الثالث. يستخدم لأحداث مرتبطة بالحاضر.",
example:"I have finished my work.",
translation:"لقد أنهيت عملي."
},

{
title:"Present Perfect with FOR",
explanation:"نستخدم for مع مدة زمنية مثل two years أو three days.",
example:"I have lived here for two years.",
translation:"أعيش هنا منذ سنتين."
},

{
title:"Present Perfect with SINCE",
explanation:"نستخدم since مع نقطة بداية زمنية محددة.",
example:"I have lived here since 2024.",
translation:"أعيش هنا منذ عام 2024."
},

{
title:"Passive Voice",
explanation:"في المبني للمجهول نركز على الفعل أو الشيء الذي وقع عليه الفعل بدل التركيز على الفاعل.",
example:"The book was written in English.",
translation:"كُتب الكتاب باللغة الإنجليزية."
},

{
title:"Reported Speech",
explanation:"نستخدم الكلام المنقول لنقل ما قاله شخص آخر، وقد تتغير بعض الأزمنة والضمائر حسب السياق.",
example:"He said that he was tired.",
translation:"قال إنه كان متعبًا."
},

{
title:"Relative Clauses",
explanation:"نستخدم who و which و that لإضافة معلومات عن شخص أو شيء داخل الجملة.",
example:"The man who lives here is my teacher.",
translation:"الرجل الذي يعيش هنا هو معلمي."
}

];

const container = document.getElementById("rules");

rules.forEach(function(rule, index) {

    const card = document.createElement("div");
    card.className = "rule";

    card.innerHTML = `
        <div class="number">القاعدة ${index + 1} من 50</div>

        <h2>${rule.title}</h2>

        <div class="explanation">
            ${rule.explanation}
        </div>

        <div class="example">
            <strong>Example:</strong><br>
            ${rule.example}

            <div class="translation">
                ${rule.translation}
            </div>
        </div>

        <div class="buttons">

            <button class="listen" type="button">
                🔊 استماع
            </button>

            <button class="translate" type="button">
                🌐 الترجمة
            </button>

        </div>
    `;

    const listenButton = card.querySelector(".listen");
    const translateButton = card.querySelector(".translate");
    const translationBox = card.querySelector(".translation");

    listenButton.addEventListener("click", function() {
        speakEnglish(rule.example);
    });

    translateButton.addEventListener("click", function() {
        if (translationBox.style.display === "none") {
            translationBox.style.display = "block";
        } else {
            translationBox.style.display = "none";
        }
    });

    container.appendChild(card);
});

function speakEnglish(text) {

    if (!window.speechSynthesis) {
        alert("ميزة النطق الصوتي غير متاحة في هذا المتصفح. جرّب فتح الموقع في Chrome.");
        return;
    }

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);

    utterance.lang = "en-US";
    utterance.rate = 0.82;
    utterance.pitch = 1;
    utterance.volume = 1;

    const voices = window.speechSynthesis.getVoices();

    const englishVoice = voices.find(function(voice) {
        return voice.lang &&
        voice.lang.toLowerCase().startsWith("en");
    });

    if (englishVoice) {
        utterance.voice = englishVoice;
    }

    window.speechSynthesis.speak(utterance);
}

if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = function() {
        window.speechSynthesis.getVoices();
    };
}

</script>

</body>
</html>
