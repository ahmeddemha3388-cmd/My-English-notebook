<script>

const rules = [

{
title: "Rule 1 — Personal Pronouns",
explanation: `ضمائر الفاعل تحل محل الأسماء وتأتي غالبًا قبل الفعل.

I = أنا
You = أنت / أنتم
He = هو
She = هي
It = لغير العاقل
We = نحن
They = هم / هن`,
examples: [
["I am a student.", "أنا طالب."],
["She is my sister.", "هي أختي."],
["They are my friends.", "هم أصدقائي."]
],
practice: "اكتب جملة باستخدام I و He و They."
},

{
title: "Rule 2 — Verb To Be",
explanation: `نستخدم am مع I.
نستخدم is مع He و She و It.
نستخدم are مع You و We و They.

يستخدم To Be للتعريف والوصف والحالة.`,
examples: [
["I am ready.", "أنا مستعد."],
["He is happy.", "هو سعيد."],
["We are students.", "نحن طلاب."]
],
practice: "أكمل: I __ ready. She __ happy. They __ students."
},

{
title: "Rule 3 — To Be: Negative",
explanation: `للنفي مع To Be نضع not بعد am أو is أو are.

am not
is not
are not

يمكن أيضًا استخدام الاختصارات:
isn't = is not
aren't = are not`,
examples: [
["I am not tired.", "أنا لست متعبًا."],
["She isn't busy.", "هي ليست مشغولة."],
["They aren't ready.", "هم ليسوا مستعدين."]
],
practice: "حوّل ثلاث جمل مثبتة إلى النفي."
},

{
title: "Rule 4 — To Be: Questions",
explanation: `لتكوين سؤال باستخدام To Be نضع am أو is أو are قبل الفاعل.

Statement:
You are ready.

Question:
Are you ready?`,
examples: [
["Are you ready?", "هل أنت مستعد؟"],
["Is he your brother?", "هل هو أخوك؟"],
["Are they students?", "هل هم طلاب؟"]
],
practice: "حوّل ثلاث جمل إلى أسئلة."
},

{
title: "Rule 5 — Object Pronouns",
explanation: `ضمائر المفعول تأتي غالبًا بعد الفعل.

me = إياي / ني
you = إياك
him = إياه
her = إياها
us = إيانا
them = إياهم`,
examples: [
["He helps me.", "هو يساعدني."],
["I know him.", "أنا أعرفه."],
["They help us.", "هم يساعدوننا."]
],
practice: "اكتب جملة باستخدام me و him و them."
},

{
title: "Rule 6 — Possessive Adjectives",
explanation: `صفات الملكية تأتي قبل الاسم.

my = ـي
your = ـك
his = ـه
her = ـها
our = ـنا
their = ـهم`,
examples: [
["This is my book.", "هذا كتابي."],
["Where is your phone?", "أين هاتفك؟"],
["Their house is big.", "منزلهم كبير."]
],
practice: "استخدم my و your و their في جمل."
},

{
title: "Rule 7 — This, That, These, Those",
explanation: `This للمفرد القريب.
That للمفرد البعيد.
These للجمع القريب.
Those للجمع البعيد.`,
examples: [
["This is my book.", "هذا كتابي."],
["That is your car.", "تلك سيارتك."],
["These are my friends.", "هؤلاء أصدقائي."],
["Those are old houses.", "تلك منازل قديمة."]
],
practice: "صف أربعة أشياء باستخدام الكلمات الأربع."
},

{
title: "Rule 8 — Singular and Plural",
explanation: `الاسم المفرد يدل على شيء واحد.
الجمع يدل على أكثر من شيء.

غالبًا نضيف s للجمع، وأحيانًا es.`,
examples: [
["I have one book.", "لدي كتاب واحد."],
["I have two books.", "لدي كتابان."],
["There are three boxes.", "هناك ثلاثة صناديق."]
],
practice: "حوّل book و car و box إلى الجمع."
},

{
title: "Rule 9 — A and An",
explanation: `نستخدم a قبل اسم مفرد يبدأ بصوت ساكن.
ونستخدم an قبل اسم مفرد يبدأ بصوت علّة.

المهم هو الصوت وليس الحرف فقط.`,
examples: [
["I have a book.", "لدي كتاب."],
["She has an apple.", "لديها تفاحة."],
["He is an engineer.", "هو مهندس."]
],
practice: "اختر a أو an: apple, book, engineer, student."
},

{
title: "Rule 10 — The",
explanation: `نستخدم the عندما يكون الاسم محددًا أو معروفًا للمتحدث والمستمع.`,
examples: [
["The book is on the table.", "الكتاب على الطاولة."],
["Open the door.", "افتح الباب."],
["The sun is bright.", "الشمس ساطعة."]
],
practice: "اكتب ثلاث جمل باستخدام the."
},

{
title: "Rule 11 — Have and Has",
explanation: `نستخدم have مع I و You و We و They.
ونستخدم has مع He و She و It.`,
examples: [
["I have a phone.", "لدي هاتف."],
["She has a car.", "لديها سيارة."],
["They have a house.", "لديهم منزل."]
],
practice: "أكمل: I __ a book. He __ a car."
},

{
title: "Rule 12 — There Is and There Are",
explanation: `There is تستخدم مع المفرد.
There are تستخدم مع الجمع.

نستخدمهما للتعبير عن وجود شيء.`,
examples: [
["There is a book on the table.", "يوجد كتاب على الطاولة."],
["There are two chairs.", "يوجد كرسيان."],
["There are many students.", "يوجد طلاب كثيرون."]
],
practice: "اكتب جملتين باستخدام There is و There are."
},

{
title: "Rule 13 — Prepositions of Place",
explanation: `أهم حروف الجر للمكان:

in = في / داخل
on = على
under = تحت
behind = خلف
next to = بجانب
in front of = أمام`,
examples: [
["The phone is in the bag.", "الهاتف داخل الحقيبة."],
["The book is on the table.", "الكتاب على الطاولة."],
["The cat is under the chair.", "القطة تحت الكرسي."]
],
practice: "صف مكان ثلاثة أشياء."
},

{
title: "Rule 14 — Present Simple",
explanation: `نستخدم المضارع البسيط للعادات والروتين والحقائق العامة.

مع I و You و We و They نستخدم الفعل الأساسي.`,
examples: [
["I study English every day.", "أدرس الإنجليزية كل يوم."],
["We work together.", "نحن نعمل معًا."],
["They play football.", "هم يلعبون كرة القدم."]
],
practice: "اكتب خمس جمل عن روتينك."
},

{
title: "Rule 15 — Third Person S",
explanation: `مع He و She و It نضيف s أو es غالبًا إلى الفعل.

work → works
watch → watches
go → goes`,
examples: [
["He works every day.", "هو يعمل كل يوم."],
["She watches TV.", "هي تشاهد التلفاز."],
["He goes to school.", "هو يذهب إلى المدرسة."]
],
practice: "حوّل work و watch و go إلى صيغة He."
},

{
title: "Rule 16 — Present Simple Negative",
explanation: `نستخدم don't مع I و You و We و They.
ونستخدم doesn't مع He و She و It.

بعد doesn't يعود الفعل إلى صورته الأساسية.`,
examples: [
["I don't speak French.", "أنا لا أتحدث الفرنسية."],
["They don't work here.", "هم لا يعملون هنا."],
["He doesn't speak English.", "هو لا يتحدث الإنجليزية."]
],
practice: "اكتب ثلاث جمل منفية."
},

{
title: "Rule 17 — Present Simple Questions",
explanation: `نستخدم Do مع I و You و We و They.
ونستخدم Does مع He و She و It.

بعد Does نستخدم الفعل الأساسي.`,
examples: [
["Do you speak English?", "هل تتحدث الإنجليزية؟"],
["Do they study here?", "هل يدرسون هنا؟"],
["Does she work here?", "هل تعمل هنا؟"]
],
practice: "حوّل ثلاث جمل إلى أسئلة."
},

{
title: "Rule 18 — Question Words",
explanation: `What = ماذا / ما
Where = أين
When = متى
Who = من
Why = لماذا
How = كيف`,
examples: [
["What is your name?", "ما اسمك؟"],
["Where do you live?", "أين تعيش؟"],
["Why are you tired?", "لماذا أنت متعب؟"],
["How do you learn?", "كيف تتعلم؟"]
],
practice: "اكتب سؤالًا بكل كلمة."
},

{
title: "Rule 19 — Adverbs of Frequency",
explanation: `تستخدم كلمات التكرار لوصف العادات.

always = دائمًا
usually = عادةً
often = غالبًا
sometimes = أحيانًا
rarely = نادرًا
never = أبدًا`,
examples: [
["I always study English.", "أدرس الإنجليزية دائمًا."],
["I usually wake up early.", "عادةً أستيقظ مبكرًا."],
["I sometimes watch TV.", "أحيانًا أشاهد التلفاز."]
],
practice: "استخدم always و usually و never."
},

{
title: "Rule 20 — Can and Can't",
explanation: `Can تعبر عن القدرة أو إمكانية الفعل.
Can't تعبر عن عدم القدرة.

بعد can يأتي الفعل الأساسي.`,
examples: [
["I can swim.", "أستطيع السباحة."],
["She can drive.", "تستطيع القيادة."],
["He can't swim.", "هو لا يستطيع السباحة."]
],
practice: "اكتب ثلاث قدرات وثلاثة أشياء لا تستطيع فعلها."
},

{
title: "Rule 21 — Imperatives",
explanation: `في صيغة الأمر نستخدم الفعل مباشرة دون فاعل.

للنهي نستخدم Don't.
ويمكن استخدام Please لجعل الطلب أكثر لطفًا.`,
examples: [
["Open the door, please.", "افتح الباب من فضلك."],
["Listen carefully.", "استمع بعناية."],
["Don't touch that.", "لا تلمس ذلك."]
],
practice: "اكتب خمس تعليمات."
},

{
title: "Rule 22 — Present Continuous",
explanation: `نستخدم المضارع المستمر لما يحدث الآن.

am / is / are + verb-ing`,
examples: [
["I am studying now.", "أنا أدرس الآن."],
["She is reading a book.", "هي تقرأ كتابًا الآن."],
["They are playing football.", "هم يلعبون كرة القدم الآن."]
],
practice: "صف ما يحدث حولك الآن."
},

{
title: "Rule 23 — Simple vs Continuous",
explanation: `Present Simple للعادات.
Present Continuous لما يحدث الآن.

every day غالبًا مع البسيط.
now و at the moment غالبًا مع المستمر.`,
examples: [
["I study English every day.", "أدرس الإنجليزية كل يوم."],
["I am studying English now.", "أنا أدرس الإنجليزية الآن."]
],
practice: "اكتب جملة للعادة وجملة لما يحدث الآن."
},

{
title: "Rule 24 — Past Simple: Was and Were",
explanation: `نستخدم was مع I و He و She و It.
ونستخدم were مع You و We و They.`,
examples: [
["I was tired yesterday.", "كنت متعبًا أمس."],
["She was at school.", "كانت في المدرسة."],
["They were happy.", "كانوا سعداء."]
],
practice: "اكتب خمس جمل في الماضي."
},

{
title: "Rule 25 — Past Simple Regular Verbs",
explanation: `نستخدم الماضي البسيط للأفعال التي حدثت وانتهت.
في الأفعال المنتظمة نضيف ed غالبًا.

work → worked
play → played
watch → watched`,
examples: [
["I worked yesterday.", "عملت أمس."],
["We played football.", "لعبنا كرة القدم."],
["She watched a movie.", "شاهدت فيلمًا."]
],
practice: "حوّل work و play و watch إلى الماضي."
},

{
title: "Rule 26 — Past Simple Irregular Verbs",
explanation: `بعض الأفعال لا تأخذ ed، بل يتغير شكلها.

go → went
eat → ate
drink → drank
see → saw
have → had`,
examples: [
["I went to school.", "ذهبت إلى المدرسة."],
["She ate breakfast.", "تناولت الفطور."],
["He drank water.", "شرب الماء."]
],
practice: "استخدم went و ate و drank في جمل."
},

{
title: "Rule 27 — Past Simple Questions",
explanation: `لتكوين سؤال في الماضي نستخدم Did.
بعد Did يعود الفعل إلى صورته الأساسية.`,
examples: [
["Did you study yesterday?", "هل درست أمس؟"],
["Did he go to school?", "هل ذهب إلى المدرسة؟"],
["Did she call you?", "هل اتصلت بك؟"]
],
practice: "حوّل ثلاث جمل إلى أسئلة باستخدام Did."
},

{
title: "Rule 28 — Past Simple Negative",
explanation: `للنفي في الماضي نستخدم did not أو didn't.
بعد didn't نستخدم الفعل الأساسي.`,
examples: [
["I didn't go.", "أنا لم أذهب."],
["She didn't study.", "هي لم تدرس."],
["They didn't come.", "هم لم يأتوا."]
],
practice: "اكتب ثلاث جمل باستخدام didn't."
},

{
title: "Rule 29 — Going To",
explanation: `نستخدم be going to للخطط والنوايا المستقبلية.

am / is / are + going to + verb`,
examples: [
["I am going to study tonight.", "سأدرس الليلة."],
["She is going to travel.", "ستسافر."],
["They are going to visit us.", "سيزوروننا."]
],
practice: "اكتب ثلاث خطط مستقبلية."
},

{
title: "Rule 30 — Future with Will",
explanation: `نستخدم will للحديث عن المستقبل والقرارات والتوقعات.
بعد will يأتي الفعل الأساسي.`,
examples: [
["I will call you tomorrow.", "سأتصل بك غدًا."],
["She will help us.", "ستساعدنا."],
["They will come soon.", "سيأتون قريبًا."]
],
practice: "اكتب ثلاث جمل باستخدام will."
},

{
title: "Rule 31 — Will Negative and Questions",
explanation: `النفي:
will not = won't

السؤال:
Will + subject + verb?`,
examples: [
["I won't forget.", "لن أنسى."],
["He won't come.", "لن يأتي."],
["Will you help me?", "هل ستساعدني؟"]
],
practice: "اكتب سؤالًا وجملة منفية باستخدام will."
},

{
title: "Rule 32 — Comparative Adjectives",
explanation: `نستخدم المقارنة عند مقارنة شيئين.
غالبًا نضيف er للصفات القصيرة ونستخدم than.

tall → taller
small → smaller`,
examples: [
["Ali is taller than Omar.", "علي أطول من عمر."],
["This car is faster than that car.", "هذه السيارة أسرع من تلك السيارة."]
],
practice: "قارن بين شيئين باستخدام than."
},

{
title: "Rule 33 — Superlatives",
explanation: `نستخدم صيغة التفضيل عندما نقارن شيئًا بمجموعة.
غالبًا نستخدم the مع صيغة التفضيل.`,
examples: [
["He is the tallest student.", "هو أطول طالب."],
["This is the biggest house.", "هذا أكبر منزل."],
["She is the best student.", "هي أفضل طالبة."]
],
practice: "اكتب جملتين باستخدام the best و the most."
},

{
title: "Rule 34 — Countable and Uncountable Nouns",
explanation: `الأسماء المعدودة يمكن عدها:
one book, two books

الأسماء غير المعدودة لا نعدها عادةً كأفراد:
water, rice, information`,
examples: [
["I have two books.", "لدي كتابان."],
["I need some water.", "أحتاج إلى بعض الماء."],
["She gave me some information.", "أعطتني بعض المعلومات."]
],
practice: "اكتب اسمين معدودين واسمين غير معدودين."
},

{
title: "Rule 35 — Some and Any",
explanation: `نستخدم some غالبًا في الجمل المثبتة.
ونستخدم any غالبًا في النفي والأسئلة.`,
examples: [
["I have some money.", "لدي بعض المال."],
["I don't have any money.", "ليس لدي أي مال."],
["Do you have any questions?", "هل لديك أي أسئلة؟"]
],
practice: "استخدم some و any في ثلاث جمل."
},

{
title: "Rule 36 — Much and Many",
explanation: `many تستخدم مع الأسماء المعدودة.
much تستخدم مع الأسماء غير المعدودة.`,
examples: [
["I have many books.", "لدي كتب كثيرة."],
["I don't have much time.", "ليس لدي وقت كثير."],
["There are many students.", "هناك طلاب كثيرون."]
],
practice: "اكتب جملة باستخدام much وجملة باستخدام many."
},

{
title: "Rule 37 — Should and Shouldn't",
explanation: `نستخدم should لتقديم النصيحة.
ونستخدم shouldn't للنصيحة بعدم فعل شيء.`,
examples: [
["You should study more.", "ينبغي أن تدرس أكثر."],
["You should get some rest.", "ينبغي أن تحصل على بعض الراحة."],
["You shouldn't worry.", "لا ينبغي أن تقلق."]
],
practice: "اكتب نصيحتين باستخدام should ونصيحة باستخدام shouldn't."
},

{
title: "Rule 38 — Must and Mustn't",
explanation: `Must تعبر عن ضرورة قوية.
Mustn't تعني أن الشيء ممنوع أو يجب عدم فعله.`,
examples: [
["You must follow the rules.", "يجب أن تتبع القواعد."],
["You must be careful.", "يجب أن تكون حذرًا."],
["You mustn't touch this.", "يجب ألا تلمس هذا."]
],
practice: "اكتب جملة باستخدام must وجملة باستخدام mustn't."
},

{
title: "Rule 39 — Have To and Has To",
explanation: `نستخدم have to للتعبير عن الضرورة أو الالتزام.
مع He و She و It نستخدم has to.`,
examples: [
["I have to study.", "يجب عليّ أن أدرس."],
["We have to leave.", "يجب علينا المغادرة."],
["She has to work.", "يجب عليها أن تعمل."]
],
practice: "اكتب جملة باستخدام have to وجملة باستخدام has to."
},

{
title: "Rule 40 — First Conditional",
explanation: `نستخدم الشرط الأول للاحتمالات الحقيقية في المستقبل.

If + Present Simple, will + verb`,
examples: [
["If I study, I will pass.", "إذا درست، سأنجح."],
["If it rains, we will stay home.", "إذا هطل المطر، فسنبقى في المنزل."]
],
practice: "اكتب جملتين باستخدام If و will."
},

{
title: "Rule 41 — Zero Conditional",
explanation: `نستخدم الشرط الصفري للحقائق العامة والأشياء التي تحدث عادةً.

If + Present Simple, Present Simple`,
examples: [
["If you heat water, it boils.", "إذا سخنت الماء، فإنه يغلي."],
["If you don't eat, you get hungry.", "إذا لم تأكل، تشعر بالجوع."]
],
practice: "اكتب حقيقة عامة باستخدام If."
},

{
title: "Rule 42 — Because and So",
explanation: `Because تستخدم لذكر السبب.
So تستخدم لذكر النتيجة.`,
examples: [
["I stayed home because I was tired.", "بقيت في المنزل لأنني كنت متعبًا."],
["I was tired, so I stayed home.", "كنت متعبًا، لذلك بقيت في المنزل."]
],
practice: "اربط جملتين باستخدام because ثم so."
},

{
title: "Rule 43 — Although",
explanation: `Although تعني رغم أن.
نستخدمها لربط فكرتين بينهما تضاد.`,
examples: [
["Although it was raining, we went out.", "رغم أن المطر كان يهطل، خرجنا."],
["Although he was tired, he continued working.", "رغم أنه كان متعبًا، واصل العمل."]
],
practice: "اكتب جملة باستخدام Although."
},

{
title: "Rule 44 — Relative Pronoun Who",
explanation: `نستخدم who للأشخاص عندما نضيف معلومات عن شخص أو نربط جملتين.`,
examples: [
["The man who lives here is a teacher.", "الرجل الذي يعيش هنا معلم."],
["She is the girl who helped me.", "هي الفتاة التي ساعدتني."]
],
practice: "اكتب جملة باستخدام who."
},

{
title: "Rule 45 — Relative Pronoun Which",
explanation: `نستخدم which غالبًا للأشياء والحيوانات لإضافة معلومات عنها.`,
examples: [
["This is the book which I bought.", "هذا هو الكتاب الذي اشتريته."],
["The car which is outside is mine.", "السيارة الموجودة في الخارج لي."]
],
practice: "اكتب جملة باستخدام which."
},

{
title: "Rule 46 — Present Perfect",
explanation: `نستخدم Present Perfect للحديث عن أحداث لها علاقة بالحاضر.

التركيب:
have / has + past participle`,
examples: [
["I have finished my work.", "لقد أنهيت عملي."],
["She has visited France.", "لقد زارت فرنسا."],
["They have arrived.", "لقد وصلوا."]
],
practice: "اكتب ثلاث جمل باستخدام have أو has."
},

{
title: "Rule 47 — Present Perfect with Ever and Never",
explanation: `Ever تستخدم غالبًا في الأسئلة عن التجارب.
Never تعني أبدًا وتستخدم للقول إن تجربة ما لم تحدث.`,
examples: [
["Have you ever visited Paris?", "هل سبق لك أن زرت باريس؟"],
["I have never seen snow.", "لم أرَ الثلج قط."],
["Have you ever tried this food?", "هل سبق لك أن جربت هذا الطعام؟"]
],
practice: "اكتب سؤالًا باستخدام ever وجملة باستخدام never."
},

{
title: "Rule 48 — Pronunciation: TH",
explanation: `للـ TH نطقان شائعان.

في كلمات مثل think يكون الصوت مختلفًا عن كلمات مثل this.

لا تنطق TH مثل ت أو د بشكل مباشر؛ تدرب على الصوت الصحيح بالاستماع والتكرار.`,
examples: [
["Think about it.", "فكر في الأمر."],
["This is my book.", "هذا كتابي."],
["Thank you.", "شكرًا لك."]
],
practice: "استمع إلى الجمل وكررها ببطء مع التركيز على TH."
},

{
title: "Rule 49 — Pronunciation: R",
explanation: `صوت R في الإنجليزية يختلف عن الراء العربية.
في النطق الإنجليزي لا ينبغي تكرار اللسان كما يحدث في الراء العربية.`,
examples: [
["Red.", "أحمر."],
["Right.", "صحيح / يمين."],
["Really?", "حقًا؟"]
],
practice: "كرر الكلمات ببطء وحاول إبقاء اللسان دون اهتزاز."
},

{
title: "Rule 50 — Pronunciation of ED",
explanation: `نهاية ED في الماضي لها ثلاثة نطقات شائعة.

في watched يكون الصوت /t/.
في played يكون الصوت /d/.
في wanted يكون الصوت /ɪd/.

لذلك لا ننطق ED بالطريقة نفسها في جميع الأفعال.`,
examples: [
["I watched a movie.", "شاهدت فيلمًا."],
["I played football.", "لعبت كرة القدم."],
["I wanted to go.", "أردت أن أذهب."]
],
practice: "استمع إلى watched و played و wanted ولاحظ اختلاف نطق ED."
}

];

const rulesContainer = document.getElementById("rules");

function createRuleCard(rule, index) {

    const card = document.createElement("div");
    card.className = "rule";

    const number = document.createElement("div");
    number.className = "rule-number";
    number.textContent = "القاعدة " + (index + 1);

    const title = document.createElement("h2");
    title.textContent = rule.title;

    const explanation = document.createElement("div");
    explanation.className = "explanation";
    explanation.textContent = rule.explanation;

    card.appendChild(number);
    card.appendChild(title);
    card.appendChild(explanation);

    rule.examples.forEach(function(example) {

        const exampleBox = document.createElement("div");
        exampleBox.className = "example";

        const english = document.createElement("div");
        english.className = "english";
        english.textContent = example[0];

        const arabic = document.createElement("div");
        arabic.className = "arabic";
        arabic.textContent = example[1];

        const button = document.createElement("button");
        button.className = "listen";
        button.type = "button";
        button.textContent = "🔊 استماع";

        button.addEventListener("click", function() {
            speakEnglish(example[0]);
        });

        exampleBox.appendChild(english);
        exampleBox.appendChild(arabic);
        exampleBox.appendChild(button);

        card.appendChild(exampleBox);
    });

    const practice = document.createElement("div");
    practice.className = "practice";

    const practiceTitle = document.createElement("strong");
    practiceTitle.textContent = "📝 التدريب";

    const practiceText = document.createElement("div");
    practiceText.textContent = rule.practice;

    practice.appendChild(practiceTitle);
    practice.appendChild(practiceText);

    card.appendChild(practice);

    return card;
}

rules.forEach(function(rule, index) {
    rulesContainer.appendChild(createRuleCard(rule, index));
});


function speakEnglish(text) {

    if (!("speechSynthesis" in window)) {
        alert("متصفحك لا يدعم ميزة النطق الصوتي.");
        return;
    }

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";
    speech.rate = 0.8;
    speech.pitch = 1;
    speech.volume = 1;

    window.speechSynthesis.speak(speech);
}

</script>
