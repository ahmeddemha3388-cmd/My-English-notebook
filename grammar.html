const container = document.getElementById("rules");

if (container) {

rules.forEach(function(rule,index){

const card = document.createElement("div");
card.className = "rule";

card.innerHTML = `
<div class="rule-number">القاعدة ${index + 1}</div>

<h2>${rule.title}</h2>

<p class="rule-explanation">${rule.explanation}</p>

<div class="examples">
${rule.examples.map(function(example){
return `
<div class="example">
<div class="english">${example.en}</div>
<div class="arabic">${example.ar}</div>
<button class="listen-btn" onclick="speakRule(${JSON.stringify(example.en)})">
🔊 استماع
</button>
</div>
`;
}).join("")}
</div>

<div class="practice">
<strong>📝 التدريب:</strong>
<p>${rule.practice}</p>
</div>
`;

container.appendChild(card);

});

}

function speakRule(text){

if(!("speechSynthesis" in window)){
alert("متصفحك لا يدعم تشغيل الصوت.");
return;
}

window.speechSynthesis.cancel();

const speech = new SpeechSynthesisUtterance(text);

speech.lang = "en-US";
speech.rate = 0.8;
speech.pitch = 1;

window.speechSynthesis.speak(speech);

}

</script>
